<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crea tu Héroe — Epic Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gloock&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap');
:root{
  --bg:#faf8f4; --surface:#fff; --border:#e0dcd3; --ink:#2a2620; --ink2:#5a5449; --ink3:#8a8478;
  --accent:#7a5c3e; --accent-light:#f0e9df; --gold:#b8935a; --radius:10px;
  /* ── alineado con index.html ── */
  --ink4:#a8a294; --surface2:#f9f8f5; --gold-pale:#f8f5e8; --gold-light:#f0ead0; --gold-ink:#8a6f0a;
  --serif:'Gloock',Georgia,serif;
  --font:'Crimson Pro',Georgia,'Times New Roman',serif;
  --green:#247038; --green-light:#e4f2ea;
  --blue:#2858a0;  --blue-light:#e6eefc;
  --purple:#6030a0;--purple-light:#ede6fa;
  --red:#b02828;   --red-light:#fae8e8;
  --r:8px; --r-lg:12px;
}
h1,h2,.result-name{font-family:var(--serif);font-weight:400;letter-spacing:.01em}
.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wrap.wide{max-width:1180px}
.home-card{background:var(--surface);border:2px solid var(--gold);border-radius:var(--r-lg);padding:22px;margin-bottom:16px}
.home-name{font-family:var(--serif);font-size:30px;line-height:1.1;margin-bottom:4px}
.home-sub{font-size:14px;color:var(--ink3);margin-bottom:14px}
.home-stats{display:flex;gap:10px;flex-wrap:wrap}
.home-stat{flex:1;min-width:96px;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;text-align:center;background:var(--surface2)}
.home-stat .k{font-size:10px;letter-spacing:.8px;color:var(--ink3);font-weight:700}
.home-stat .v{font-family:var(--serif);font-size:24px;color:var(--ink)}
.node-pick{width:100%;text-align:left;cursor:pointer}
.pick-hint{font-size:12.5px;color:var(--gold-ink);font-weight:600;margin:10px 0 4px}
/* ══════ MAESTRÍAS — compartido entre index.html y creador-personaje.html ══════ */
.mst{margin-top:26px}
.mst-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mst-tabs{display:flex;gap:6px;flex-wrap:wrap}
.mst-tab{padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:var(--surface);
  font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--ink3);cursor:pointer;white-space:nowrap}
.mst-tab .n{font-size:10px;color:var(--ink4);font-weight:600;margin-left:5px}
.mst-tab.active{background:var(--gold-pale);border-color:var(--gold);color:var(--gold)}
.mst-tab.owned{border-color:var(--gold)}
.mst-marks{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--gold-pale);
  border:1px solid var(--gold);border-radius:20px;margin-left:auto}
.mst-marks-l{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.6px}
.mst-marks-v{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink)}
.mst-mbtn{border:1px solid var(--gold);background:var(--surface);color:var(--gold);border-radius:50%;
  width:24px;height:24px;font-size:13px;line-height:1;cursor:pointer;padding:0}

.mst-root{display:flex;gap:14px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-lg);
  border:1px solid var(--border);background:var(--surface2);margin-bottom:16px}
.mst-root.on{border-color:var(--gold);background:var(--gold-pale)}
.mst-root.can{cursor:pointer;border-style:dashed}
.mst-root-body{flex:1;min-width:0}
.mst-root-name{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink)}
.mst-root-eff{font-size:12.5px;color:var(--ink3);line-height:1.55;margin-top:3px}

.mst-cols{display:grid;gap:14px}
.mst-col{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;
  display:flex;flex-direction:column}
.mst-col.locked{opacity:.42}
.mst-col-head{padding:11px 13px;background:var(--surface2);border-bottom:1px solid var(--border)}
.mst-col-name{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);line-height:1.15}
.mst-col-sub{font-size:11px;color:var(--ink4);font-style:italic}
.mst-col-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.mst-chip{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:9px;
  background:var(--surface);border:1px solid var(--border);color:var(--ink3)}
.mst-chip.gold{background:var(--gold-pale);border-color:var(--gold);color:var(--gold)}
.mst-low{font-size:11px;color:var(--ink3);line-height:1.45;padding:8px 13px;border-bottom:1px solid var(--border);
  background:var(--gold-pale)}
.mst-low b{color:var(--gold);font-size:10px;letter-spacing:.5px;display:block;margin-bottom:2px}

.mst-tier{padding:9px 13px;border-bottom:1px solid var(--border)}
.mst-tier:last-child{border-bottom:0}
.mst-tier-head{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
.mst-tier-t{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink4)}
.mst-gate{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--border);color:var(--ink4);white-space:nowrap}
.mst-gate.open{border-color:var(--gold);color:var(--gold);background:var(--gold-pale)}

.mst-node{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;
  background:var(--surface2);cursor:not-allowed;position:relative}
.mst-node:last-child{margin-bottom:0}
.mst-node.can{cursor:pointer;background:var(--surface);border-style:dashed}
.mst-node.can:hover{border-color:var(--gold);background:var(--gold-pale)}
.mst-node.own{background:var(--gold-pale);border-color:var(--gold);cursor:pointer}
.mst-node.lock{opacity:.45}
.mst-node-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mst-node-name{font-size:13px;font-weight:700;color:var(--ink);flex:1;min-width:90px}
.mst-node-eff{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:3px}
.mst-node-fire{font-size:11px;color:var(--ink2);line-height:1.45;margin-top:5px;padding:5px 7px;
  border-radius:6px;background:var(--surface);border-left:2px solid var(--gold)}
.mst-node-fire b{color:var(--gold);font-size:9.5px;letter-spacing:.5px}
.mst-tick{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);flex:none;
  display:flex;align-items:center;font-size:9px;justify-content:center;color:#fff}
.mst-node.own .mst-tick,.mst-root.on .mst-tick{background:var(--gold);border-color:var(--gold)}

.pl{font-size:8.5px;font-weight:700;letter-spacing:.5px;padding:1px 6px;border-radius:8px;flex:none}
.pl-avelir{background:var(--green-light);color:var(--green)}
.pl-veil{background:var(--blue-light);color:var(--blue)}
.pl-hold{background:var(--purple-light);color:var(--purple)}
.pl-inter{background:var(--red-light);color:var(--red)}
.mst-tag{font-size:8.5px;font-weight:700;letter-spacing:.5px;padding:1px 6px;border-radius:8px;
  background:var(--ink);color:#fff;flex:none}

.mst-sum{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  padding:12px 14px;border:1px solid var(--gold);border-radius:var(--r-lg);background:var(--gold-pale);margin-bottom:16px}
.mst-sum-k{font-size:9.5px;font-weight:700;letter-spacing:.7px;color:var(--gold)}
.mst-sum-v{font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.35;margin-top:2px}
.mst-sum-v small{font-family:var(--font);font-size:11.5px;color:var(--ink3);display:block}
@media(max-width:900px){.mst-cols{grid-template-columns:1fr!important}}

/* ── tabla de ataque base ── */
.mst-base{border:1.5px solid var(--gold);border-radius:var(--r-lg);background:var(--gold-pale);padding:14px 16px;margin-bottom:14px}
.mst-base-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.mst-base-t{font-size:11px;letter-spacing:1.4px;font-weight:700;color:var(--gold-ink)}
.mst-base-n{font-size:11.5px;color:var(--ink3);font-style:italic}
.mst-base-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.mst-base-tb th{font-size:10px;letter-spacing:.6px;color:var(--ink3);font-weight:700;text-align:center;padding:3px 6px;border-bottom:1px solid var(--gold)}
.mst-base-tb th small{display:block;font-size:9.5px;letter-spacing:0;font-weight:400;color:var(--ink4);text-transform:none}
.mst-base-tb td{padding:4px 6px;border-bottom:1px solid var(--border);text-align:center}
.mst-base-tb td.bd{font-weight:700;color:var(--ink2);width:74px}
.mst-base-tb td.dm{font-family:var(--serif);font-size:16px;color:var(--ink);width:52px}
.mst-base-tb td.pc{color:var(--ink2);font-variant-numeric:tabular-nums}
.mst-base-tb tr.hi td{background:var(--gold-light)}
.mst-base-tb tr.hi td.bd,.mst-base-tb tr.hi td.dm{color:var(--gold-ink);font-weight:700}
.mst-base-tb tr.sig td{text-align:left;font-size:11.5px;color:var(--ink2);background:transparent;border-bottom:none;padding-top:5px}
.mst-base-mods{margin-top:9px;padding-top:8px;border-top:1px dashed var(--gold);font-size:11.5px;color:var(--ink2);line-height:1.65}
.mst-base-mods b{color:var(--gold-ink);font-weight:700}
.mst-base-mods small{color:var(--ink3)}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
.progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:24px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);transition:width .3s}
h1{font-size:24px;font-weight:700;margin-bottom:8px}
h2{font-size:20px;font-weight:700;margin-bottom:6px}
.step-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);margin-bottom:12px}
.lead{font-size:15px;color:var(--ink2);margin-bottom:20px}
.teach{background:var(--accent-light);border-left:3px solid var(--gold);border-radius:6px;padding:14px 16px;margin-bottom:20px;font-size:14px;color:var(--ink2)}
.teach strong{color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;font-size:16px;color:var(--ink);cursor:pointer;transition:border-color .15s;min-height:52px}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:var(--accent-light)}
.opt-sub{display:block;font-size:13px;color:var(--ink3);margin-top:4px}
input[type=text]{width:100%;padding:14px 16px;font-size:17px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:14px 24px;font-size:16px;font-weight:600;cursor:pointer;min-height:50px}
.btn:disabled{opacity:.4;cursor:default}
.btn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--border)}
.btn-row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:120px}
.result{background:var(--surface);border:2px solid var(--gold);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:20px}
.result-icon{font-size:40px;margin-bottom:8px}
.result-name{font-size:26px;font-weight:700;margin-bottom:6px}
.result-desc{font-size:15px;color:var(--ink2);margin-bottom:8px}
.result-meta{font-size:13px;color:var(--ink3);background:var(--accent-light);border-radius:6px;padding:8px 12px;margin-top:12px;display:inline-block}
.explore{margin-top:16px}
.explore summary{cursor:pointer;font-size:14px;color:var(--accent);font-weight:600;padding:8px 0}
.explore-item{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px;cursor:pointer}
.explore-item:hover{border-color:var(--gold)}
.explore-item.current{border-color:var(--gold);background:var(--accent-light)}
.explore-item-name{font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.explore-item-desc{font-size:13px;color:var(--ink3);margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent);margin-left:6px}
.affinity{font-size:11px;color:var(--gold);font-weight:700}
.feat-box{text-align:left;margin-top:14px}
.summary-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.summary-row{display:flex;padding:10px 0;border-bottom:1px solid var(--border);font-size:15px}
.summary-row:last-child{border-bottom:none}
.summary-key{font-weight:600;width:110px;color:var(--ink2);flex-shrink:0}
.summary-val{flex:1}
.hint{font-size:13px;color:var(--ink3);margin-top:6px}
/* Habilidades */
.abil-list{margin-top:14px;text-align:left}
.abil{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.abil-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.abil-name{font-weight:700;font-size:15px}
.abil-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:9px}
.abil-tag.base{background:#eef2e6;color:#5a6a3a}
.abil-tag.heroica{background:#f3e6ee;color:#8a3a6a}
.abil-cost{font-size:12px;color:var(--accent);font-weight:600}
.abil-desc{font-size:13px;color:var(--ink2);margin-bottom:2px}
.bands{margin-top:8px;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.band{display:flex;font-size:12px;border-top:1px solid var(--border)}
.band:first-child{border-top:none}
.band-roll{flex-shrink:0;width:44px;text-align:center;font-weight:700;color:var(--ink3);background:var(--accent-light);padding:6px 4px}
.band-eff{padding:6px 8px;color:var(--ink2)}
.band.b12 .band-roll{background:var(--gold);color:#fff}
.band.b12 .band-eff{color:var(--ink);font-weight:600}
.echo-note{font-size:11px;color:#8a3a6a;margin-top:6px;font-style:italic}
.concept{background:#f7f4ee;border:1px dashed var(--gold);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:12.5px;color:var(--ink2)}
.concept strong{color:var(--ink)}
.abil-mini{font-size:12px;color:var(--ink3);margin-top:3px}
.edit-btn{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-light);border:none;border-radius:7px;padding:3px 9px;margin-left:8px;cursor:pointer}
.edit-btn:hover{filter:brightness(.96)}
.edit-panel{margin:2px 0 12px;padding:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px}
.summary-val{display:flex;align-items:center;flex-wrap:wrap}
/* Imágenes */
.cart{display:inline-block;line-height:0}
.cart img{display:block;width:auto;border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.14)}
.cart-fallback{align-items:center;justify-content:center;background:var(--accent-light);border-radius:10px;line-height:1}
.cart-lg img{max-height:340px;max-width:100%;margin:0 auto}
.cart-lg .cart-fallback{width:160px;height:250px;font-size:84px;margin:0 auto}
.cart-md img{max-height:160px}
.cart-md .cart-fallback{width:110px;height:160px;font-size:64px}
.cart-sm img{height:60px;border-radius:7px;box-shadow:0 1px 6px rgba(0,0,0,.14)}
.cart-sm .cart-fallback{width:44px;height:60px;font-size:28px;border-radius:7px}
.kart{margin:16px 0}
.kart img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--border);box-shadow:0 3px 16px rgba(0,0,0,.14)}
.ex-head{display:flex;gap:11px;align-items:flex-start}
.ex-head>.ex-body{flex:1;min-width:0}
@page{margin:14mm}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .wrap{max-width:100%;padding:0}
}
/* Character sheet imprimible */
.sheet{display:none}
@media print{
  .sheet{display:block}
  .screen{display:none}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="progress no-print"><div class="progress-fill" id="progress"></div></div>
  <div id="app" class="screen"></div>
</div>
<div id="sheet" class="sheet"></div>
<script src="data.js"></script>
<script>
/* ══════════ ESTADO ══════════ */
// Reglas de economía traídas del Hub (fuente de verdad; no hardcodear en el texto)
GAMEDATA.rules = Object.assign({ hpBase:10, aenPerTurn:2, actionsPerTurn:2, movementPerTurn:1 }, GAMEDATA.rules||{});

var state = {
  step: 0,
  name: '',
  factionScores: {}, factionId: null, factionFeatIdx: null,
  classScores: {}, classId: null,
  kitScores: {}, kitId: null,
  trunkId: null, marks: [], marksTotal: 1,
  _edit: null
};
var MARCAS_AL_NACER = 1;

/* ══════════ DEFINICIÓN DEL TEST ══════════ */
// F1: qué guía a tu personaje → apunta a facción
var Q_FACTION1 = {
  q: '¿Qué guía a tu personaje?',
  opts: [
    {t:'La fe', f:'cheran'},
    {t:'El poder', f:'vorin'},
    {t:'La justicia', f:'escarlata'},
    {t:'El legado y el conocimiento', f:'aetharion'},
    {t:'El equilibrio y la naturaleza', f:'urushan'},
    {t:'La libertad', f:'pueblos'}
  ]
};

// Clase: 4 preguntas, sistema de puntos
var Q_CLASS = [
  {q:'¿Cómo te imaginas peleando?', opts:[
    {t:'Cuerpo a cuerpo, de frente, sin miedo', s:{fury:2,knight:1,monk:1}},
    {t:'Desde las sombras, sin que me vean', s:{shadow:2,archer:1}},
    {t:'A distancia, con precisión', s:{archer:2,wizard:1}},
    {t:'Canalizando poder mágico', s:{wizard:2,warlock:1,druid:1}},
    {t:'Apoyando y potenciando a mi equipo', s:{bard:2,druid:1,knight:1}},
    {t:'Con inventos y trucos', s:{inventor:2,bard:1}}
  ]},
  {q:'¿Qué papel te llama más en el grupo?', opts:[
    {t:'Ser el que aguanta los golpes (tanque)', s:{knight:2,fury:1}},
    {t:'Ser el que hace más daño', s:{fury:2,shadow:1,archer:1}},
    {t:'Ser el que cura y protege', s:{druid:2,knight:1}},
    {t:'Ser el astuto que controla la situación', s:{monk:1,inventor:1,warlock:1,bard:1}},
    {t:'Ser el misterioso con poder oculto', s:{warlock:2,shadow:1}}
  ]},
  {q:'¿Qué te emociona más de un héroe?', opts:[
    {t:'Su fuerza bruta y presencia', s:{fury:2,knight:1}},
    {t:'Su elegancia y técnica', s:{monk:2,bard:1}},
    {t:'Su conexión con fuerzas más grandes', s:{wizard:1,druid:1,warlock:1}},
    {t:'Su ingenio y creatividad', s:{inventor:2,wizard:1}},
    {t:'Su frialdad y letalidad', s:{shadow:2,archer:1}}
  ]},
  {q:'¿Qué frase te representa?', opts:[
    {t:'"El mejor ataque es aplastar primero"', s:{fury:2}},
    {t:'"Un solo golpe certero basta"', s:{archer:1,shadow:1,monk:1}},
    {t:'"El conocimiento es poder"', s:{wizard:2,warlock:1}},
    {t:'"La naturaleza siempre encuentra el camino"', s:{druid:2}},
    {t:'"Nadie protege a mi gente más que yo"', s:{knight:2}},
    {t:'"Con la herramienta correcta, todo es posible"', s:{inventor:2}},
    {t:'"Una buena historia mueve al mundo"', s:{bard:2}}
  ]}
];

// Descripciones de clase en español para jugador nuevo
var CLASS_DESC = {
  fury:'Guerrero de rabia pura. Mientras más daño recibe, más peligroso se vuelve.',

/* ══════════ HELPERS ══════════ */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function byId(id){return GAMEDATA.factions.concat(GAMEDATA.classes,GAMEDATA.kits).filter(function(x){return x.id===id})[0]}
function getFaction(id){return GAMEDATA.factions.filter(function(f){return f.id===id})[0]}
function getClass(id){return GAMEDATA.classes.filter(function(c){return c.id===id})[0]}
function getKit(id){return GAMEDATA.kits.filter(function(k){return k.id===id})[0]}
function topScored(scores, getList){
  var best=null,bestv=-1;
  Object.keys(scores).forEach(function(k){if(scores[k]>bestv){bestv=scores[k];best=k}});
  return best;
}
function sortByScore(list, scores, idKey){
  return list.slice().sort(function(a,b){return (scores[b[idKey]]||0)-(scores[a[idKey]]||0)});
}
function addScores(target, s){Object.keys(s).forEach(function(k){target[k]=(target[k]||0)+s[k]})}

/* ══════════ FLUJO DE PASOS ══════════ */
// Pasos: 0=bienvenida 1=nombre 2=facción-q1 3=facción-feat 4=facción-result
//        5..8=clase-q(4) 9=clase-result 10..12=kit-q(3) 13=kit-result 14=resumen
var TOTAL_STEPS = 19;

function render(){
  var el=document.getElementById('app');
  var s=state.step;
  if(s!==18)state._edit=null;
  var bar=document.getElementById('progress').parentNode;
  var wrap=document.getElementById('wrap');
  var lineal=(typeof s==='number');
  bar.style.display=lineal?'':'none';
  if(lineal)document.getElementById('progress').style.width=Math.round((s/(TOTAL_STEPS-1))*100)+'%';
  wrap.className='wrap'+(s==='tree'?' wide':'');
  var h='';
  if(s==='home'){el.innerHTML=renderHome();window.scrollTo(0,0);return}
  if(s==='tree'){el.innerHTML=renderPlayerTree();window.scrollTo(0,0);return}
  if(s===0) h=renderWelcome();
  else if(s===1) h=renderName();
  else if(s===2) h=renderFactionQ1();
  else if(s===3) h=renderFactionFeat();
  else if(s===4) h=renderFactionResult();
  else if(s>=5&&s<=8) h=renderClassQ(s-5);
  else if(s===9) h=renderClassResult();
  else if(s>=10&&s<=14) h=renderKitQ(s-10);
  else if(s===15) h=renderKitResult();
  else if(s===16) h=renderTrunkQ();
  else if(s===17) h=renderTrunkResult();
  else if(s===18) h=renderSummary();
  el.innerHTML=h;
  window.scrollTo(0,0);
}

function go(step){state.step=step;render()}
function next(){go(state.step+1)}
function back(){if(state.step>0)go(state.step-1)}

function renderClassQ(qi){
  var Q=Q_CLASS[qi];
  var teach='';
  if(qi===0){
    teach='<div class="teach">Antes de empezar: en una pelea, tu <strong>turno</strong> es 1 movimiento + 2 acciones. Cada acción puede ser un ataque o una <strong>habilidad</strong> (tu movida especial). Tu clase decide qué habilidades geniales tienes. Elige según el estilo que te llame.</div>';
  }
  var h='<div class="step-label">Paso 3 · Tu clase ('+(qi+1)+' de 4)</div><h2>'+esc(Q.q)+'</h2>'+teach;
  Q.opts.forEach(function(o,i){
    var sel=(state._classAns&&state._classAns[qi]===i)?' sel':'';
    h+='<button class="opt'+sel+'" onclick="pickClass('+qi+','+i+')">'+esc(o.t)+'</button>';
  });
  var backStep=qi===0?4:(5+qi-1);
  h+='<div class="btn-row"><button class="btn btn-ghost" onclick="go('+backStep+')">← Atrás</button></div>';
  return h;
}
function pickClass(qi,oi){
  if(!state._classAns)state._classAns={};
  state._classAns[qi]=oi;
  // recomputar scores desde todas las respuestas
  state.classScores={};
  Object.keys(state._classAns).forEach(function(k){
    var q=Q_CLASS[k];var ans=state._classAns[k];
    if(q&&q.opts[ans])addScores(state.classScores,q.opts[ans].s);
  });
  if(qi<3){go(5+qi+1)}
  else{
    // determinar clase ganadora
    state.classId=topScored(state.classScores);
    go(9);
  }

    h+='<div class="explore-item'+cur+'"><div class="explore-item-name">'+esc(kt.name)+' <span style="font-weight:400;font-size:12px">'+esc(kt.fantasy||'')+' · +'+(kt.hpBonus||0)+'HP</span>'+(kt.id===state.kitId?'<span class="tag">tu resultado</span>':(sc>0?'<span class="affinity">'+sc+' pts</span>':''))+'</div><div class="explore-item-desc">'+esc(kt.archetype||'')+'</div>'+
      kitAbilHtml(kt)+
      (kt.id===state.kitId?'':'<button class="btn btn-ghost" style="margin-top:8px;width:100%" onclick="switchKit(\''+kt.id+'\')">Elegir '+esc(kt.name)+'</button>')+
      '</div>';
  });
  h+='</details>'+
    '<div class="btn-row"><button class="btn btn-ghost" onclick="go(10)">← Rehacer test</button><button class="btn" onclick="go(16)">Cómo peleas →</button></div>';
  return h;
}
function switchKit(id){state.kitId=id;render()}


/* ══════════ PUENTE PARA EL MOTOR COMPARTIDO ══════════ */
var MSTH = {
  data:     function(){ return GAMEDATA },
  esc:      function(s){ return esc(s) },
  get:      function(){ return {marks:state.marks, marksTotal:state.marksTotal} },
  set:      function(pid, obj){
              if(obj.marks !== undefined) state.marks = obj.marks;
              if(obj.marksTotal !== undefined) state.marksTotal = obj.marksTotal;
              saveHero();
            },
  rerender: function(){ render() }
};

/* ══════════════════════════════════════════════════════════════════════
   MOTOR DE MAESTRÍAS — compartido entre index.html y creador-personaje.html
   La página anfitriona define MSTH antes de este bloque:
     MSTH.data()        -> GAMEDATA
     MSTH.get(pid)      -> {marks:[ids], marksTotal:n}
     MSTH.set(pid,obj)  -> guarda {marks} y/o {marksTotal}
     MSTH.rerender()    -> vuelve a pintar
     MSTH.esc(s)        -> escapa html
   ══════════════════════════════════════════════════════════════════════ */
var MST_TRUNK = {};
var MST_PLANE = {avelir:'AVELIR', veil:'VELO', hold:'CUENCO', inter:'INTERPLANO'};

function mstTrunks(){ var g = MSTH.data(); return (g && g.masteryTrunks) ? g.masteryTrunks : [] }
function mstEsc(s){ return MSTH.esc(s) }

/* ── puertas ── */
function gateOk(tier, own){
  var have = 0;
  tier.nodes.forEach(function(n){ if(own[n.id]) have++ });
  if(tier.gate === 'all') return have === tier.nodes.length;
  if(tier.gate === 'any') return have >= 1;
  return have >= Number(tier.gate);
}
function gateLabel(tier){
  if(tier.gate === 'all') return tier.nodes.length === 1 ? '1 de 1' : 'los ' + tier.nodes.length;
  if(tier.gate === 'any') return '1 de ' + tier.nodes.length;
  return tier.gate + ' de ' + tier.nodes.length;
}

/* ── localizar un nodo por id ── */
function mstFind(nodeId){
  var hit = null;
  mstTrunks().forEach(function(tr){
    if(tr.root.id === nodeId){ hit = {tr:tr, root:1}; return }
    tr.branches.forEach(function(br){
      br.tiers.forEach(function(ti, ix){
        ti.nodes.forEach(function(n){ if(n.id === nodeId) hit = {tr:tr, br:br, ti:ti, ix:ix, n:n} });
      });
    });
  });
  return hit;
}


/* ── tabla de ataque base, derivada para este jugador ── */
function mstBandPct(n){
  /* tira n d12 y quédate con el mejor: P(máx ≤ k) = (k/12)^n */
  var le = function(k){ return Math.pow(k/12, n) };
  return { b1: le(4), b2: le(8)-le(4), b3: le(11)-le(8), b12: 1-le(11) };
}
function mstBaseTable(d, tr){
  var g = MSTH.data();
  var BA = g && g.baseAttack;
  if(!BA || !BA.bands) return '';
  var rootOn = !!d.own[tr.root.id];

  /* configuraciones de dado dentro de este tronco */
  var cfgs = [];
  cfgs.push({ n: rootOn ? 2 : 1, lbl: rootOn ? 'Raíz · ' + mstEsc(tr.sub) : 'sin especializar', die: null });
  tr.branches.forEach(function(b){
    if(d.branches[b.id] && d.branches[b.id].mastery)
      cfgs.push({ n:3, lbl:'Maestría · ' + mstEsc(b.name), die:b.die });
  });

  var h = '<div class="mst-base">';
  h += '<div class="mst-base-hd"><span class="mst-base-t">TABLA DE ATAQUE BASE</span>' +
       '<span class="mst-base-n">' + mstEsc(BA.note || '') + '</span></div>';
  h += '<table class="mst-base-tb"><tr><th>Tirada 1d12</th><th>Daño</th>' +
       cfgs.map(function(c){ return '<th>' + c.n + 'd12<small>' + c.lbl + '</small></th>' }).join('') + '</tr>';

  var pcts = cfgs.map(function(c){ return mstBandPct(c.n) });
  BA.bands.forEach(function(b){
    var hi = !!b.signature;
    h += '<tr' + (hi ? ' class="hi"' : '') + '><td class="bd">' + mstEsc(b.dice) + '</td><td class="dm">' + b.dmg + '</td>';
    cfgs.forEach(function(c, i){
      h += '<td class="pc">' + (pcts[i][b.band]*100).toFixed(1) + '%</td>';
    });
    h += '</tr>';
    if(hi){
      var firmas = cfgs.filter(function(c){ return c.die }).map(function(c){ return c.lbl.replace('Maestría · ','') + ' +' + c.die });
      h += '<tr class="sig"><td colspan="' + (2+cfgs.length) + '">✨ En el 12 dispara tu dado de firma: ' +
           (firmas.length ? mstEsc(firmas.join(' · ')) : '<em>ninguno todavía — lo da la Maestría de una rama</em>') + '</td></tr>';
    }
  });
  h += '</table>';

  /* qué de lo comprado mueve la tabla */
  var mods = [];
  tr.branches.forEach(function(b){
    b.tiers.forEach(function(ti){ ti.nodes.forEach(function(n){
      if(!d.own[n.id]) return;
      var t = (n.eff||'') + ' ' + (n.fire||'') + ' ' + (n.active||'');
      if(/\bband\b|\bbands\b|banda/i.test(t)) mods.push(n.name + ' <small>(' + b.name + ')</small>');
    })});
  });
  var lows = d.lows.map(function(l){ return l.low.name + ' <small>(' + l.b + ')</small>' });
  if(mods.length || lows.length){
    h += '<div class="mst-base-mods">';
    if(mods.length) h += '<div><b>Mueven tu banda:</b> ' + mods.join(' · ') + '</div>';
    if(lows.length) h += '<div><b>Rescatan la banda 1-4:</b> ' + lows.join(' · ') + '</div>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* ── estado derivado ── */
function deriveMastery(rec){
  rec = rec || {};
  var own = {};
  (rec.marks || []).forEach(function(id){ own[id] = 1 });
  var out = { own:own, spent:Object.keys(own).length,
              total:(rec.marksTotal == null ? 0 : rec.marksTotal),
              roots:{}, branches:{}, dice:{}, lows:[], reacts:[], legends:[], actives:[] };
  mstTrunks().forEach(function(tr){
    var rootOn = !!own[tr.root.id];
    if(rootOn) out.roots[tr.id] = 1;
    tr.branches.forEach(function(br){
      var st = { open:rootOn, owned:0, tiers:[], mastery:0, die:br.die, low:null };
      var prevOk = rootOn;
      br.tiers.forEach(function(ti){
        var unlocked = prevOk;
        ti.nodes.forEach(function(n){
          if(!own[n.id]) return;
          st.owned++;
          if(n.mast)   st.mastery = 1;
          if(n.react)  out.reacts.push({b:br.name, n:n});
          if(n.legend) out.legends.push({b:br.name, n:n});
          if(n.active) out.actives.push({b:br.name, n:n});
        });
        st.tiers.push({ unlocked:unlocked, done:gateOk(ti, own) });
        prevOk = unlocked && gateOk(ti, own);
      });
      if(st.owned > 0){ st.low = br.low; out.lows.push({b:br.name, low:br.low, die:br.die}) }
      out.branches[br.id] = st;
      if(st.mastery)   out.dice[br.id] = '3d12';
      else if(rootOn)  out.dice[br.id] = '2d12';
    });
  });
  return out;
}

/* ── ¿comprable ahora? ── */
function canBuy(d, tr, br, ix){
  if(!br) return !d.own[tr.root.id];
  if(!d.own[tr.root.id]) return false;
  return d.branches[br.id].tiers[ix].unlocked;
}

/* ── comprar / soltar, con cascada ── */
function masteryToggle(pid, nodeId){
  var rec = MSTH.get(pid);
  if(!rec) return;
  var marks = (rec.marks || []).slice();
  var i = marks.indexOf(nodeId);
  if(i > -1){
    marks.splice(i, 1);
    var guard = 0;
    while(guard++ < 60){
      var d = deriveMastery({marks:marks, marksTotal:rec.marksTotal});
      var drop = null;
      mstTrunks().forEach(function(tr){
        if(!d.own[tr.root.id]){
          tr.branches.forEach(function(br){ br.tiers.forEach(function(ti){
            ti.nodes.forEach(function(n){ if(d.own[n.id] && !drop) drop = n.id }) }) });
        } else {
          tr.branches.forEach(function(br){
            var st = d.branches[br.id];
            br.tiers.forEach(function(ti, ix){
              if(st.tiers[ix].unlocked) return;
              ti.nodes.forEach(function(n){ if(d.own[n.id] && !drop) drop = n.id });
            });
          });
        }
      });
      if(!drop) break;
      marks.splice(marks.indexOf(drop), 1);
    }
  } else {
    var d0 = deriveMastery(rec);
    if(d0.total - d0.spent <= 0) return;
    var f = mstFind(nodeId);
    if(!f) return;
    if(!canBuy(d0, f.tr, f.br, f.ix)) return;
    marks.push(nodeId);
  }
  MSTH.set(pid, {marks:marks});
  MSTH.rerender();
}
function adjustMarks(pid, delta){
  var rec = MSTH.get(pid);
  if(!rec) return;
  var t = Math.max(0, Math.min(60, (rec.marksTotal == null ? 0 : rec.marksTotal) + delta));
  if(delta < 0 && t < (rec.marks || []).length) return;
  MSTH.set(pid, {marksTotal:t});
  MSTH.rerender();
}

/* ── un nodo ── */
function mstNodeHtml(pid, d, tr, br, ix, n, ro){
  var owned = !!d.own[n.id];
  var open  = canBuy(d, tr, br, ix);
  var can   = !owned && open && (d.total - d.spent) > 0;
  var cls   = 'mst-node' + (owned ? ' own' : (open ? ' can' : ' lock'));
  var act   = (!ro && (owned || can))
            ? ' data-action="mastery-toggle" data-id="' + pid + '" data-node="' + n.id + '"' : '';
  var h = '<div class="' + cls + '"' + act + '>';
  h += '<div class="mst-node-head"><span class="mst-tick">' + (owned ? '✓' : '') + '</span>';
  h += '<span class="mst-node-name">' + mstEsc(n.name) + '</span>';
  if(n.react)  h += '<span class="mst-tag">REACCIÓN</span>';
  if(n.mast)   h += '<span class="mst-tag">MAESTRÍA</span>';
  if(n.legend) h += '<span class="mst-tag">LEGENDARIA</span>';
  h += '<span class="pl pl-' + n.plane + '">' + (MST_PLANE[n.plane] || n.plane) + '</span></div>';
  h += '<div class="mst-node-eff">' + mstEsc(n.eff) + '</div>';
  if(n.fire)   h += '<div class="mst-node-fire"><b>AL 12 · ' + mstEsc(n.die || '') + '</b><br>' + mstEsc(n.fire) + '</div>';
  if(n.active) h += '<div class="mst-node-fire"><b>ACTIVA</b><br>' + mstEsc(n.active) + '</div>';
  if(n.bet)    h += '<div class="mst-node-fire"><b>LA APUESTA</b><br>' + mstEsc(n.bet) + '</div>';
  if(n.edge)   h += '<div class="mst-node-fire"><b>BORDE</b><br>No saca de combate a criaturas duras ni a jefes: pierden una acción.</div>';
  return h + '</div>';
}

/* ── el árbol completo ──
   opts: {readonly, showMarks, showTabs, trunkId} */
function masteryTreeHtml(pid, opts){
  opts = opts || {};
  if(!mstTrunks().length) return '';
  var rec = MSTH.get(pid);
  if(!rec) return '';
  var ro  = !!opts.readonly;
  var d   = deriveMastery(rec);
  var tid = opts.trunkId || MST_TRUNK[pid] || mstTrunks()[0].id;
  var tr  = mstTrunks().filter(function(t){ return t.id === tid })[0] || mstTrunks()[0];
  var free = d.total - d.spent;
  var h = '';

  if(opts.showTabs !== false){
    h += '<div class="mst-top"><div class="mst-tabs">';
    mstTrunks().forEach(function(t){
      var cnt = d.own[t.root.id] ? 1 : 0;
      t.branches.forEach(function(b){ cnt += d.branches[b.id].owned });
      h += '<div class="mst-tab' + (t.id === tr.id ? ' active' : '') + (cnt ? ' owned' : '') +
           '" data-action="mastery-trunk" data-id="' + pid + '" data-trunk="' + t.id + '">' +
           mstEsc(t.name) + '<span class="n">' + (cnt || '') + '</span></div>';
    });
    h += '</div>';
    h += '<div class="mst-marks"><span class="mst-marks-l">MARCAS LIBRES</span>' +
         '<span class="mst-marks-v">' + free + '</span>';
    if(opts.showMarks){
      h += '<button class="mst-mbtn" data-action="sub-mark" data-id="' + pid + '">−</button>' +
           '<button class="mst-mbtn" data-action="add-mark" data-id="' + pid + '">+</button>';
    } else {
      h += '<span style="font-size:11px;color:var(--ink3)">de ' + d.total + '</span>';
    }
    h += '</div></div>';
  }

  h += mstBaseTable(d, tr);

  /* resumen de lo que cambió en la mesa */
  if(d.spent){
    var dice = [];
    mstTrunks().forEach(function(t){
      if(!d.own[t.root.id]) return;
      var m = [];
      t.branches.forEach(function(b){ if(d.branches[b.id].mastery) m.push(b.name + ' 3d12 · firma ' + b.die) });
      dice.push(t.name + ' 2d12' + (m.length ? ' → ' + m.join(' • ') : ''));
    });
    var lows = d.lows.map(function(l){ return l.low.name + ' (' + l.b + ')' });
    var nm = function(a){ return a.map(function(x){ return x.n.name }).join(' • ') };
    h += '<div class="mst-sum">' +
      '<div><div class="mst-sum-k">DADOS DE ATAQUE</div><div class="mst-sum-v">' + (dice.length ? mstEsc(dice.join(' • ')) : '1d12') + '</div></div>' +
      '<div><div class="mst-sum-k">FIRMAS DE BANDA 1-4</div><div class="mst-sum-v">' + (lows.length ? mstEsc(lows.join(' • ')) : '—') + '</div></div>' +
      '<div><div class="mst-sum-k">REACCIONES</div><div class="mst-sum-v">' + (d.reacts.length ? mstEsc(nm(d.reacts)) : '—') + '<small>una por ronda, gratis</small></div></div>' +
      '<div><div class="mst-sum-k">INTERPLANO</div><div class="mst-sum-v">' + (d.legends.length ? mstEsc(nm(d.legends)) : '—') + '<small>una por sesión</small></div></div>' +
      '</div>';
  }

  /* raíz */
  var rootOn = !!d.own[tr.root.id];
  var rootCan = !ro && (rootOn || free > 0);
  h += '<div class="mst-root' + (rootOn ? ' on' : (rootCan ? ' can' : '')) + '"' +
       (rootCan ? ' data-action="mastery-toggle" data-id="' + pid + '" data-node="' + tr.root.id + '"' : '') + '>';
  h += '<span class="mst-tick" style="margin-top:3px">' + (rootOn ? '✓' : '') + '</span>';
  h += '<div class="mst-root-body"><div class="mst-root-name">' + mstEsc(tr.root.name) +
       ' <span class="pl pl-' + tr.root.plane + '">' + MST_PLANE[tr.root.plane] + '</span>' +
       ' <span class="mst-tag">RAÍZ</span></div>';
  h += '<div class="mst-root-eff">' + mstEsc(tr.root.eff) + '</div></div>';
  h += '<div style="text-align:right;flex:none"><div class="mst-sum-k">' + mstEsc(tr.sub) + '</div>' +
       '<div class="mst-sum-v">' + tr.root.dice + 'd12</div></div></div>';

  /* ramas */
  h += '<div class="mst-cols" style="grid-template-columns:repeat(' + tr.branches.length + ',1fr)">';
  tr.branches.forEach(function(br){
    var st = d.branches[br.id];
    h += '<div class="mst-col' + (rootOn ? '' : ' locked') + '">';
    h += '<div class="mst-col-head"><div class="mst-col-name">' + mstEsc(br.name) + '</div>' +
         '<div class="mst-col-sub">' + mstEsc(br.sub || '') + '</div>' +
         '<div class="mst-col-chips"><span class="mst-chip' + (st.owned ? ' gold' : '') + '">' + st.owned + ' nodos</span>' +
         '<span class="mst-chip' + (st.mastery ? ' gold' : '') + '">' + (st.mastery ? '3d12' : (rootOn ? '2d12' : '1d12')) + '</span>' +
         '<span class="mst-chip' + (st.owned ? ' gold' : '') + '">firma ' + mstEsc(br.die) + '</span></div></div>';
    if(st.owned && br.low)
      h += '<div class="mst-low"><b>BANDA 1-4 · GRATIS</b>' + mstEsc(br.low.name) + ' — ' + mstEsc(br.low.eff) + '</div>';
    br.tiers.forEach(function(ti, ix){
      var t = st.tiers[ix];
      h += '<div class="mst-tier"><div class="mst-tier-head">' +
           '<span class="mst-tier-t">' + mstEsc(ti.t) + '</span>' +
           '<span class="mst-gate' + (t.done ? ' open' : '') + '">' + gateLabel(ti) + (t.done ? ' ✓' : '') + '</span></div>';
      ti.nodes.forEach(function(n){ h += mstNodeHtml(pid, d, tr, br, ix, n, ro) });
      h += '</div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

/* ── despachador compartido: la página anfitriona lo llama desde su click handler ── */
function mstHandleAction(a, el){
  if(a === 'mastery-trunk'){ MST_TRUNK[el.getAttribute('data-id')] = el.getAttribute('data-trunk'); MSTH.rerender(); return true }
  if(a === 'mastery-toggle'){ masteryToggle(el.getAttribute('data-id'), el.getAttribute('data-node')); return true }
  if(a === 'add-mark'){ adjustMarks(el.getAttribute('data-id'), 1); return true }
  if(a === 'sub-mark'){ adjustMarks(el.getAttribute('data-id'), -1); return true }
  return false;
}


document.addEventListener('click', function(e){
  var t = e.target;
  var el = t && t.closest ? t.closest('[data-action]') : null;
  if(!el) return;
  mstHandleAction(el.getAttribute('data-action'), el);
});

/* ══════════ PERSISTENCIA — el creador es la app del jugador ══════════ */
var HERO_KEY = 'eq_hero_v1';
function heroPayload(){
  return { v:1, name:state.name||'', factionId:state.factionId, featChosen:state.factionFeatIdx,
           classId:state.classId, kitId:state.kitId, trunkId:state.trunkId,
           marks:state.marks.slice(), marksTotal:state.marksTotal };
}
function saveHero(){ try{ localStorage.setItem(HERO_KEY, JSON.stringify(heroPayload())) }catch(e){} }
function loadHero(){ try{ var s=localStorage.getItem(HERO_KEY); return s?JSON.parse(s):null }catch(e){ return null } }
function applyHero(o){
  if(!o) return false;
  state.name = o.name||''; state.factionId = o.factionId||null;
  state.factionFeatIdx = (o.featChosen==null?null:o.featChosen);
  state.classId = o.classId||null; state.kitId = o.kitId||null; state.trunkId = o.trunkId||null;
  state.marks = o.marks||[]; state.marksTotal = (o.marksTotal==null?MARCAS_AL_NACER:o.marksTotal);
  return true;
}
function nuevoHeroe(){
  if(!confirm('Esto borra a ' + (state.name||'tu héroe') + ' de este navegador. ¿Descargaste tu .json?')) return;
  try{ localStorage.removeItem(HERO_KEY) }catch(e){}
  state.name=''; state.factionId=null; state.factionFeatIdx=null; state.classId=null; state.kitId=null;
  state.trunkId=null; state.marks=[]; state.marksTotal=MARCAS_AL_NACER;
  state.factionScores={}; state.classScores={}; state.kitScores={};
  state._classAns=null; state._kitAns=null;
  go(0);
}
function descargarHeroe(){
  var o = heroPayload();
  var blob = new Blob([JSON.stringify(o,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.name||'heroe').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href) }, 1500);
}

/* ══════════ PASO 5 · ESPECIALIZACIÓN DE ARMA ══════════ */
var TRUNK_ES = {
  grip: {t:'Armas de mano', d:'Espada, hacha, escudo, martillo. Lo que se sostiene y se blande.'},
  aim:  {t:'Armas a distancia', d:'Arco, lanzamiento, emboscada. Lo que sale de tus manos y llega lejos.'},
  form: {t:'El cuerpo como arma', d:'Puños, agilidad, canalización interna. No cargas nada porque no lo necesitas.'},
  focus:{t:'Canalización', d:'Bastón, varita, instrumento. Un objeto que no golpea: conduce.'}
};
var TRUNK_BY_KIT = {asalto:'grip',filo:'grip',dagas:'grip',corsario:'grip',bastion:'grip',
  gladiador:'grip',berserker_kit:'grip',juramento:'grip',
  halcon:'aim',cuervo:'aim', colmillo:'form',zen:'form',
  conducto:'focus',crisol:'focus',raiz:'focus'};
var TRUNK_BY_CLASS = {fury:'grip',knight:'grip',shadow:'grip',
  archer:'aim',inventor:'aim', monk:'form',
  wizard:'focus',warlock:'focus',druid:'focus',bard:'focus'};
function getTrunk(id){ return mstTrunks().filter(function(t){return t.id===id})[0] }
function suggestedTrunk(){ return TRUNK_BY_KIT[state.kitId] || TRUNK_BY_CLASS[state.classId] || 'grip' }
/* todos los nodos comprados, agrupados por rama */
function nodosComprados(){
  var t = getTrunk(state.trunkId); if(!t) return [];
  var out = [];

    });
    inner+='</table>';
    h+='<div style="margin-bottom:18px;page-break-inside:avoid;break-inside:avoid">'+shSec('ATAQUE BASE')+shCard(inner)+'</div>';
  }
  if(tk){
    var es=(TRUNK_ES[tk.id]||{});
    var bl='';
    bl+=shCard('<div style="font-weight:bold;font-size:14px">⚔️ '+esc(tk.root.name)+' <span style="font-weight:normal;font-size:11px;color:'+SH.ink3+'">Raíz · '+esc(tk.name)+'</span></div><div style="font-size:12.5px;color:'+SH.ink2+';margin-top:3px">'+esc(tk.root.eff)+'</div>',true);
    mstTrunks().forEach(function(tr){
      tr.branches.forEach(function(br){
        var tocada=false;
        br.tiers.forEach(function(ti){ti.nodes.forEach(function(n){
          if(state.marks.indexOf(n.id)===-1)return;
          if(!tocada&&br.low){bl+=shCard('<div style="font-size:11.5px;color:'+SH.ink2+'"><strong style="color:'+SH.gink+'">BANDA 1–4 · '+esc(br.name).toUpperCase()+' (GRATIS)</strong> — '+esc(br.low.name)+': '+esc(br.low.eff)+'</div>');tocada=true}
          bl+=shCard('<div style="font-weight:bold;font-size:13.5px">◆ '+esc(n.name)+' <span style="font-weight:normal;font-size:11px;color:'+SH.ink3+'">'+esc(br.name)+(n.react?' · REACCIÓN':'')+(n.mast?' · MAESTRÍA':'')+(n.legend?' · LEGENDARIA':'')+'</span></div><div style="font-size:12px;color:'+SH.ink2+';margin-top:2px">'+esc(n.eff)+'</div>'+(n.fire?'<div style="font-size:11px;color:'+SH.ink2+';margin-top:4px;border-left:2px solid '+SH.gold+';padding-left:7px"><strong style="color:'+SH.gink+'">AL 12 · '+esc(n.die||'')+'</strong> '+esc(n.fire)+'</div>':'')+(n.active?'<div style="font-size:11px;color:'+SH.ink2+';margin-top:4px;border-left:2px solid '+SH.gold+';padding-left:7px"><strong style="color:'+SH.gink+'">ACTIVA</strong> '+esc(n.active)+'</div>':''));
        })});
      });
    });
    bl+='<div style="font-size:10.5px;color:'+SH.ink3+';margin:8px 0 5px">Ramas de '+esc(tk.name)+' — se abren con marcas:</div><table style="width:100%;border-collapse:collapse;font-size:11px">';
    tk.branches.forEach(function(b){
      bl+='<tr><td style="border:1px solid '+SH.bd+';padding:4px 7px;font-weight:bold;width:100px;background:'+SH.pale+'">'+esc(b.name)+'</td><td style="border:1px solid '+SH.bd+';padding:4px 7px;color:'+SH.ink2+'">'+esc(b.sub||'')+' · firma '+esc(b.die)+'</td></tr>';
    });
    bl+='</table>';
    h+='<div style="margin-bottom:18px;page-break-inside:avoid;break-inside:avoid">'+shSec('ESPECIALIZACIÓN — '+esc(tk.name).toUpperCase()+(es.t?' · '+esc(es.t).toUpperCase():''))+bl+'</div>';
  }
  if(ft){h+='<div style="margin-bottom:18px;page-break-inside:avoid;break-inside:avoid">'+shSec('FEAT DE FACCIÓN')+shCard('<div style="font-weight:bold;font-size:14px">✨ '+esc(ft.name)+' <span style="font-weight:normal;font-size:11px;color:'+SH.ink3+'">('+esc(ft.attr)+')</span></div><div style="font-size:12.5px;color:'+SH.ink2+';margin-top:3px">'+esc(ft.desc)+'</div>')+'</div>';}
  if(c&&c.abilities&&c.abilities.length){
    h+='<div style="margin-bottom:18px">'+shSec('HABILIDADES DE CLASE — '+esc(c.name).toUpperCase()+' · ENERGÍA: '+esc(c.resource))+
       '<div style="font-size:10.5px;color:'+SH.ink3+';margin:-4px 0 8px">Las habilidades con tabla se resuelven tirando 1d12: banda 1–4 · 5–8 · 9–11 · 12 (efecto máximo).</div>';
    c.abilities.forEach(function(a){h+=sheetAbil(a)});
    h+='</div>';
  }
  if(k){
    h+='<div style="margin-bottom:18px;page-break-inside:avoid;break-inside:avoid">'+shSec('KIT — '+esc(k.name).toUpperCase()+(k.fantasy?' · '+esc(k.fantasy).toUpperCase():''))+
      '<div style="width:65%;margin:2px auto 12px">'+kitArt(k)+'</div>'+
      ((GAMEDATA.kitArchetypes||{})[k.arch]?shCard('<div style="font-weight:bold;font-size:14px">⚙ '+esc(GAMEDATA.kitArchetypes[k.arch].name)+' <span style="font-weight:normal;font-size:11px;color:'+SH.ink3+'">arquetipo</span></div><div style="font-size:12.5px;color:'+SH.ink2+';margin-top:3px">'+esc(GAMEDATA.kitArchetypes[k.arch].desc)+'</div>'):'')+
      (k.ability?shCard('<div style="font-weight:bold;font-size:14px">🎒 '+esc(k.ability.name)+' <span style="font-weight:normal;font-size:11px;color:'+SH.ink3+'">'+esc(k.ability.cost||'')+'</span></div><div style="font-size:12.5px;color:'+SH.ink2+';margin-top:3px">'+esc(k.ability.desc||'')+(k.ability.drawback?'<br><em style="color:#b02828">Desventaja: '+esc(k.ability.drawback)+'</em>':'')+'</div>'):'')+
      '</div>';
  }
  function blankSection(title,lines){
    var s='<div style="margin-bottom:18px;page-break-inside:avoid;break-inside:avoid">'+shSec(title);
    for(var i=0;i<lines;i++)s+='<div style="border-bottom:1px dotted '+SH.gold+';height:26px"></div>';
    return s+'</div>';
  }
  h+=blankSection('APARIENCIA Y PERSONALIDAD',4);
  h+=blankSection('TRASFONDO / HISTORIA',5);
  h+=blankSection('INVENTARIO',5);
  h+=blankSection('NOTAS',5);
  h+='<div style="text-align:center;font-size:11px;color:'+SH.ink3+';margin-top:24px;border-top:1px solid '+SH.bd+';padding-top:8px">Creado con el Generador de Héroes · Epic Quest</div>';
  h+='</div>';
  document.getElementById('sheet').innerHTML=h;
}


/* ══════════ ARRANQUE + LINK DIRECTO ══════════ */
function finalizar(){ saveHero(); go('home') }
function init(){
  var guardado = loadHero();
  if(guardado && guardado.name && applyHero(guardado)) state.step = 'home';
  else state.step = 0;
  render();
}
init();

</script>
</body>
</html>
