<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avelir — Archivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F2EC; --card:#FFFFFF; --ink:#191C1F; --ink2:#5B6168; --ink3:#8B9099;
  --line:#DEE1DC; --line2:#C9CDC6; --note:#F3E9C8; --notedge:#D9C98F;
  --serif:"Newsreader",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  --sbw:250px; --ntw:320px; --topbar:57px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbar) + 12px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.65}
a{color:inherit}
button{font-family:var(--sans);cursor:pointer}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ═══ barra superior ═══ */
.top{position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:40;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px}
.burger{display:none;background:none;border:1px solid var(--line2);border-radius:2px;width:34px;height:34px;font-size:16px;color:var(--ink2)}
.brand{font-size:20px;text-decoration:none;white-space:nowrap}
.brand em{font-style:italic;color:var(--ink2)}
.topsearch{flex:1;max-width:460px;display:flex;align-items:center;gap:9px;border:1px solid var(--line2);background:var(--card);border-radius:2px;padding:7px 12px;margin:0 auto}
.topsearch svg{flex:none;stroke:var(--ink3)}
.topsearch input{border:0;outline:0;background:transparent;font-family:var(--sans);font-size:14px;color:var(--ink);width:100%}
.topsearch input::placeholder{color:var(--ink3)}
.topsearch:focus-within{border-color:#B9A55C}
.topsearch kbd{font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.notesbtn{background:none;border:1px solid var(--line2);border-radius:2px;padding:7px 13px;font-size:13px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:7px}
.notesbtn:hover{color:var(--ink);border-color:var(--ink3)}
.notesbtn .dot{min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}

/* ═══ sidebar izquierdo ═══ */
.sb{position:fixed;top:var(--topbar);left:0;bottom:0;width:var(--sbw);z-index:30;background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:18px 0 30px;font-family:var(--sans)}
.sb-sec{margin-bottom:4px}
.sb-static{display:block;padding:7px 18px;font-size:13.5px;color:var(--ink2);text-decoration:none;border-left:2px solid transparent}
.sb-static:hover{color:var(--ink)}
.sb-static.on{color:var(--ink);border-left-color:var(--ink);background:#ECEEE9}
.sb-h{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:7px 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:left;margin-top:14px}
.sb-h .tw{font-size:9px;transition:transform .15s;color:var(--ink3)}
.sb-h .cd{width:7px;height:7px;border-radius:4px;flex:none}
.sb-h.open .tw{transform:rotate(90deg)}
.sb-h .n{margin-left:auto;font-size:11px}
.sb-h:hover{color:var(--ink2)}
.sb-list{display:none}
.sb-h.open + .sb-list{display:block}
.sb-a{display:flex;align-items:center;gap:7px;padding:5px 18px 5px 28px;font-size:13.5px;color:var(--ink2);text-decoration:none;border-left:2px solid transparent;line-height:1.35}
.sb-a:hover{color:var(--ink)}
.sb-a.on{color:var(--ink);border-left-color:currentColor;background:#ECEEE9}
.sb-a .nd{width:5px;height:5px;border-radius:3px;background:var(--notedge);flex:none;margin-left:auto}
@media(prefers-reduced-motion:reduce){.sb-h .tw{transition:none}}

/* ═══ contenido ═══ */
.main{margin-left:var(--sbw);padding:calc(var(--topbar) + 26px) 40px 80px;max-width:1060px;transition:margin-right .2s}
body.notes-open .main{margin-right:var(--ntw)}
.crumb{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin-bottom:10px}
.crumb a{color:var(--ink3);text-decoration:none}
.crumb a:hover{color:var(--ink)}

/* portada */
.hero h1{font-weight:300;font-size:clamp(36px,5.5vw,56px);line-height:1.03;margin:6px 0 12px;letter-spacing:-.02em}
.hero p{margin:0 0 30px;max-width:58ch;color:var(--ink2);font-size:19px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:38px;font-family:var(--sans)}
.stat{background:var(--card);padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--ink3)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.cell{background:var(--card);padding:19px 21px;text-decoration:none;display:block}
.cell:hover{background:#FBFBFA;background:color-mix(in srgb,var(--c,#888) 6%,#fff)}
.cell .rule{width:26px;height:2px;margin-bottom:11px}
.cell h3{font-weight:400;font-size:20px;margin:0 0 7px;letter-spacing:-.01em}
.cell p{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink2)}

/* índice */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 24px}
.chip{font-size:12.5px;padding:4px 12px;border:1px solid var(--line2);border-radius:100px;background:transparent;color:var(--ink2)}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.res{border-top:1px solid var(--line)}
.res a{display:block;padding:17px 0;border-bottom:1px solid var(--line);text-decoration:none}
.res a:hover .rt{text-decoration:underline;text-underline-offset:3px}
.res .meta{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.res .rt{font-size:20px;display:block;margin-bottom:4px}
.res .snip{font-size:15.5px;color:var(--ink2);line-height:1.6;margin:0}
.res mark{background:var(--note);color:var(--ink);padding:0 2px}
.empty{padding:38px 0;color:var(--ink2);font-size:17px}

/* artículo */
.page{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:48px;align-items:start}
.ptitle{font-weight:300;font-size:clamp(32px,5vw,46px);line-height:1.05;margin:10px 0 24px;letter-spacing:-.02em}
.body{max-width:66ch}
.body h2{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:36px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
.body h2:first-child{margin-top:0;border-top:0;padding-top:0}
.body p{margin:0 0 15px}
.body ul{margin:0 0 15px;padding-left:20px}
.body li{margin-bottom:6px}
.body strong{font-weight:500}
.body em{font-style:italic;color:var(--ink2)}
.wl{text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:1px}
.wl:hover{background:#EDEFEA}
.wl-dead{color:var(--ink3);border-bottom:1px dotted var(--ink3);cursor:help}
.typepill{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:100px;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,#fff)}

/* rail derecho del artículo */
.rail{position:sticky;top:calc(var(--topbar) + 20px);font-family:var(--sans)}
.rail-box{margin-bottom:26px}
.rail .eyebrow{display:block;margin-bottom:10px}
.toc ol{list-style:none;margin:0;padding:0;counter-reset:s}
.toc li{counter-increment:s}
.toc a{display:flex;gap:9px;font-size:13px;color:var(--ink2);text-decoration:none;padding:4px 0;line-height:1.4}
.toc a:before{content:counter(s,decimal-leading-zero);color:var(--ink3);font-size:11px;padding-top:2px}
.toc a:hover{color:var(--ink)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow a{font-size:12.5px;text-decoration:none;padding:4px 11px;border:1px solid var(--line2);border-radius:100px;color:var(--ink2)}
.tagrow a:hover{border-color:var(--ink3);color:var(--ink)}

/* linaje */
.tree{border:1px solid var(--line2);background:var(--card);padding:14px 14px 10px}
.tr-node{border:1px solid var(--line);padding:8px 10px;margin-bottom:0}
.tr-node .nm{font-size:13.5px;font-weight:500;line-height:1.3}
.tr-node .nm a{text-decoration:none;border-bottom:1px solid var(--line2)}
.tr-node .nm a:hover{border-bottom-color:var(--ink)}
.tr-node .ep{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.35}
.tr-node.dead .nm{color:var(--ink3)}
.tr-link{width:1px;height:14px;background:var(--line2);margin:0 auto}
.tr-gen{border-left:2px solid var(--line2);padding-left:10px;display:flex;flex-direction:column;gap:8px}

/* faltantes */
.want{border-top:1px solid var(--line)}
.want-row{display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.want-row .meta{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;min-width:86px}
.want-row .wn{font-size:19px}
.want-row .src{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin-left:auto}
.want-row .src a{color:var(--ink3)}

/* ═══ panel de notas ═══ */
.notes{position:fixed;top:var(--topbar);right:0;bottom:0;width:var(--ntw);z-index:35;background:#FBF8EE;border-left:1px solid var(--notedge);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;font-family:var(--sans)}
body.notes-open .notes{transform:none}
@media(prefers-reduced-motion:reduce){.notes{transition:none}}
.notes-h{padding:16px 18px 10px;border-bottom:1px solid var(--notedge)}
.notes-h .t{font-family:var(--serif);font-size:17px}
.notes-h .s{font-size:12px;color:var(--ink3);margin-top:2px}
.notes-ta{flex:none;margin:14px 18px 6px;border:1px solid var(--notedge);background:var(--card);font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--ink);padding:10px 12px;min-height:150px;resize:vertical;outline:none;border-radius:2px}
.notes-ta:focus{border-color:#B9A55C}
.notes-save{margin:0 18px 12px;font-size:11.5px;color:var(--ink3);min-height:15px}
.notes-all{flex:1;overflow-y:auto;padding:6px 18px 20px;border-top:1px solid var(--notedge)}
.notes-all .eyebrow{display:block;margin:12px 0 8px}
.nitem{border:1px solid var(--notedge);background:var(--card);padding:9px 11px;margin-bottom:8px;border-radius:2px}
.nitem a{font-size:13px;font-weight:500;text-decoration:none}
.nitem a:hover{text-decoration:underline}
.nitem p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.5;white-space:pre-line}
.nitem .del{background:none;border:0;color:var(--ink3);font-size:11px;padding:0;float:right}
.nitem .del:hover{color:#8b1a1a}
.notes-foot{padding:10px 18px;border-top:1px solid var(--notedge);display:flex;gap:8px}
.notes-foot button{flex:1;background:var(--card);border:1px solid var(--notedge);border-radius:2px;padding:7px;font-size:12.5px;color:var(--ink2)}
.notes-foot button:hover{color:var(--ink)}

.foot{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin-top:60px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap}
.overlay{display:none;position:fixed;inset:0;z-index:25;background:rgba(20,22,20,.35)}
body.sb-open .overlay{display:block}

@media(max-width:980px){
  .page{grid-template-columns:1fr;gap:26px}
  .rail{position:static}
}
@media(max-width:820px){
  .burger{display:block}
  .sb{transform:translateX(-100%);transition:transform .2s;z-index:45}
  body.sb-open .sb{transform:none}
  .main{margin-left:0;padding:calc(var(--topbar) + 20px) 20px 60px}
  body.notes-open .main{margin-right:0}
  .notes{width:min(92vw,360px);z-index:46}
  .topsearch kbd{display:none}
  body{font-size:17px}
}
</style>
</head>
<body>

<header class="top">
  <button class="burger" id="burger" aria-label="Abrir navegación">☰</button>
  <a class="brand" href="#inicio">Avelir <em>— archivo</em></a>
  <div class="topsearch">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Buscar en el archivo" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <button class="notesbtn" id="notesbtn">✎ Notas <span class="dot" id="notecount" hidden>0</span></button>
</header>

<div class="overlay" id="overlay"></div>
<nav class="sb" id="sb" aria-label="Navegación del archivo"></nav>

<main class="main" id="app"></main>

<aside class="notes" id="notes" aria-label="Tus notas">
  <div class="notes-h">
    <div class="t" id="notes-title">Notas</div>
    <div class="s" id="notes-sub">Solo tuyas — se guardan en este navegador</div>
  </div>
  <textarea class="notes-ta" id="notes-ta" placeholder="Apunta aquí lo que esta página te dispare — una idea, una duda, el germen de un despacho…"></textarea>
  <div class="notes-save" id="notes-save"></div>
  <div class="notes-all" id="notes-all"></div>
  <div class="notes-foot">
    <button id="notes-export">Exportar todas (.md)</button>
    <button id="notes-close">Cerrar</button>
  </div>
</aside>

<script src="lore.js"></script>
<script>
if(typeof LORE==='undefined'){
  document.getElementById('app').innerHTML='<section style="padding:60px 0 40px;max-width:60ch">'
   +'<h1 style="font-weight:300;font-size:clamp(30px,5vw,44px);letter-spacing:-.02em;margin:0 0 14px">El archivo est\u00e1 vac\u00edo</h1>'
   +'<p style="color:var(--ink2);font-size:18px;line-height:1.65">Esta p\u00e1gina se nutre de <code style="font-family:var(--mono);font-size:15px">lore.js</code>, y no lo encontr\u00f3 en su misma carpeta. Coloca el archivo <code style="font-family:var(--mono);font-size:15px">lore.js</code> junto a <code style="font-family:var(--mono);font-size:15px">wiki.html</code> y recarga. El lore se genera desde el Hub: Configuraci\u00f3n \u2192 \ud83c\udf10 lore.js p\u00fablico.</p></section>';
  document.querySelector('.top').style.display='flex';
  throw new Error('LORE no cargado');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function typeOf(id){for(var i=0;i<LORE.types.length;i++)if(LORE.types[i].id===id)return LORE.types[i];return null}
function colorOf(id){var t=typeOf(id);return t&&t.color?t.color:'#5B6168'}

/* ── grafo ── */
var BY_SLUG={},BY_TITLE={},OUT={},IN={},DEAD={};
(function(){
  LORE.pages.forEach(function(p){p.slug=slug(p.title);BY_SLUG[p.slug]=p;BY_TITLE[p.title.trim().toLowerCase()]=p});
  LORE.pages.forEach(function(p){
    OUT[p.slug]=[];var rx=/\[\[([^\]]+)\]\]/g,m,seen={};
    while((m=rx.exec(p.content||''))!==null){
      var name=m[1].trim(),key=name.toLowerCase();
      if(seen[key])continue;seen[key]=1;
      OUT[p.slug].push(name);
      var t=BY_TITLE[key];
      if(t)(IN[t.slug]=IN[t.slug]||[]).push(p);
      else (DEAD[name]=DEAD[name]||[]).push(p);
    }
  });
})();

/* ── notas (localStorage con guardia) ── */
var NK='avelir_notas_v1',HAS_LS=true,MEM={};
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){HAS_LS=false}
function nload(){if(!HAS_LS)return MEM;try{return JSON.parse(localStorage.getItem(NK)||'{}')}catch(e){return{}}}
function nsave(d){MEM=d;if(HAS_LS)try{localStorage.setItem(NK,JSON.stringify(d))}catch(e){}}
function noteKey(){var r=curRoute();return BY_SLUG[r]?r:'_generales'}
function noteLabel(k){return k==='_generales'?'Generales':(BY_SLUG[k]?BY_SLUG[k].title:k)}

/* ── markdown + enlaces ── */
function inline(t){
  t=esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  return t.replace(/\[\[([^\]]+)\]\]/g,function(_,name){
    name=name.trim();
    var p=BY_TITLE[name.toLowerCase()];
    if(p)return '<a class="wl" style="color:'+colorOf(p.type)+'" href="#'+p.slug+'">'+esc(name)+'</a>';
    var g=LORE.linkTypes&&LORE.linkTypes[name],lb=g&&typeOf(g)?typeOf(g).label:'sin ficha';
    return '<span class="wl-dead" title="'+esc(lb)+' — todavía sin página">'+esc(name)+'</span>';
  });
}
function renderBody(md){
  var lines=String(md||'').split('\n'),out='',ul=false,secs=[];
  function cu(){if(ul){out+='</ul>';ul=false}}
  lines.forEach(function(ln){
    var t=ln.trim();if(!t){cu();return}
    var h=t.match(/^#+\s*(.+)$/);
    if(h){cu();var id=slug(h[1]);secs.push({id:id,label:h[1]});out+='<h2 id="'+id+'">'+inline(h[1])+'</h2>';return}
    if(/^[-*]\s+/.test(t)){if(!ul){out+='<ul>';ul=true}out+='<li>'+inline(t.replace(/^[-*]\s+/,''))+'</li>';return}
    cu();out+='<p>'+inline(t)+'</p>';
  });
  cu();return{html:out,secs:secs};
}
function lastSection(md){
  var parts=String(md||'').split(/^#+\s*.+$/m),tail=parts[parts.length-1]||'';
  return tail.replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/\*\*?/g,'').trim();
}
function clip(s,n){s=s.replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n).replace(/\s+\S*$/,'')+'…':s}
function plain(md){return String(md||'').replace(/^#+\s*.+$/gm,' ').replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/\*\*?/g,'').replace(/\s+/g,' ').trim()}

/* ── sidebar ── */
var SB_OPEN={};
LORE.types.forEach(function(t){SB_OPEN[t.id]=true});
function renderSidebar(){
  var r=curRoute(),notes=nload(),h='';
  h+='<div class="sb-sec">';
  h+='<a class="sb-static'+(r==='inicio'?' on':'')+'" href="#inicio">Estado del mundo</a>';
  h+='<a class="sb-static'+(r==='indice'?' on':'')+'" href="#indice">Índice y búsqueda</a>';
  var nd=Object.keys(DEAD).length;
  h+='<a class="sb-static'+(r==='faltantes'?' on':'')+'" href="#faltantes">Fichas pendientes · '+nd+'</a>';
  h+='</div>';
  LORE.types.forEach(function(t){
    var pages=LORE.pages.filter(function(p){return p.type===t.id});
    if(!pages.length)return;
    pages.sort(function(a,b){return a.title.localeCompare(b.title,'es')});
    h+='<button class="sb-h'+(SB_OPEN[t.id]?' open':'')+'" data-sb="'+t.id+'"><span class="tw">▶</span><span class="cd" style="background:'+colorOf(t.id)+'"></span>'+esc(t.label)+'<span class="n">'+pages.length+'</span></button>';
    h+='<div class="sb-list">';
    pages.forEach(function(p){
      h+='<a class="sb-a'+(p.slug===r?' on':'')+'" style="'+(p.slug===r?'color:'+colorOf(p.type):'')+'" href="#'+p.slug+'">'+esc(p.title)+(notes[p.slug]?'<span class="nd" title="Tienes una nota aquí"></span>':'')+'</a>';
    });
    h+='</div>';
  });
  document.getElementById('sb').innerHTML=h;
  document.querySelectorAll('.sb-h').forEach(function(b){
    b.addEventListener('click',function(){var id=this.getAttribute('data-sb');SB_OPEN[id]=!SB_OPEN[id];renderSidebar()});
  });
}

/* ── vistas ── */
function viewHome(){
  var chars=LORE.pages.filter(function(p){return p.type==='character'}).length;
  var places=LORE.pages.filter(function(p){return p.type==='place'}).length;
  var facs=LORE.pages.filter(function(p){return p.type==='faction'});
  var h='<section class="hero"><span class="eyebrow">Archivo público · v'+esc(LORE.version)+' · actualizado '+esc(LORE.exportedAt)+'</span>'
   +'<h1>El estado de Avelir</h1>'
   +'<p>El archivo de consulta para quienes escriben desde dentro del mundo. Todo lo que está aquí es lo que Avelir sabe de sí mismo.</p>';
  h+='<div class="statgrid">'
   +'<div class="stat"><b>'+LORE.pages.length+'</b><span>páginas</span></div>'
   +'<div class="stat"><b>'+facs.length+'</b><span>facciones</span></div>'
   +'<div class="stat"><b>'+chars+'</b><span>personajes</span></div>'
   +'<div class="stat"><b>'+places+'</b><span>lugares</span></div>'
   +'<div class="stat"><b style="color:#8b1a1a">'+Object.keys(DEAD).length+'</b><span>fichas pendientes</span></div>'
   +'</div></section>';
  h+='<div class="sechead"><span class="eyebrow">Situación geopolítica — dónde está parado cada poder</span></div><div class="grid">';
  facs.forEach(function(p){
    h+='<a class="cell" style="--c:'+colorOf(p.type)+'" href="#'+p.slug+'"><div class="rule" style="background:'+colorOf(p.type)+'"></div><h3>'+esc(p.title)+'</h3><p>'+esc(clip(lastSection(p.content),160))+'</p></a>';
  });
  h+='</div>';
  var recent=LORE.pages.filter(function(p){return p.type!=='faction'});
  if(recent.length){
    h+='<div class="sechead"><span class="eyebrow">Últimas fichas del archivo</span><a class="eyebrow" style="text-decoration:none" href="#indice">Ver todo →</a></div><div class="grid">';
    recent.slice(-6).reverse().forEach(function(p){
      var t=typeOf(p.type);
      h+='<a class="cell" style="--c:'+colorOf(p.type)+'" href="#'+p.slug+'"><div class="rule" style="background:'+colorOf(p.type)+'"></div><h3>'+esc(p.title)+'</h3><p>'+esc(t?t.label:'')+' · '+esc(clip(plain(p.content),110))+'</p></a>';
    });
    h+='</div>';
  }
  return h+footer();
}

var Q='',F=[];
function viewIndex(){
  var h='<div class="crumb"><a href="#inicio">Archivo</a> › Índice</div><h1 class="ptitle">Índice y búsqueda</h1><div class="chips">';
  LORE.types.forEach(function(t){
    var n=LORE.pages.filter(function(p){return p.type===t.id}).length;
    if(!n)return;
    h+='<button class="chip'+(F.indexOf(t.id)>-1?' on':'')+'" data-t="'+t.id+'">'+esc(t.label)+' '+n+'</button>';
  });
  h+='</div>';
  var ql=Q.trim().toLowerCase();
  var res=LORE.pages.filter(function(p){
    if(F.length&&F.indexOf(p.type)===-1)return false;
    if(!ql)return true;
    return p.title.toLowerCase().indexOf(ql)>-1||(p.content||'').toLowerCase().indexOf(ql)>-1;
  });
  res.sort(function(a,b){return a.title.localeCompare(b.title,'es')});
  if(!res.length)return h+'<p class="empty">Nada coincide con «'+esc(Q)+'». Prueba con menos palabras.</p>'+footer();
  h+='<div class="res">';
  res.forEach(function(p){
    var t=typeOf(p.type),pl=plain(p.content),snip;
    if(ql){
      var i=pl.toLowerCase().indexOf(ql);
      if(i>-1){
        var a=Math.max(0,i-70),frag=(a?'…':'')+pl.slice(a,i+ql.length+110)+'…';
        snip=esc(frag).replace(new RegExp('('+Q.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
      }
    }
    if(!snip)snip=esc(clip(pl,170));
    h+='<a href="#'+p.slug+'"><div class="meta" style="color:'+colorOf(p.type)+'">'+esc(t?t.label:'—')+'</div><span class="rt">'+esc(p.title)+'</span><p class="snip">'+snip+'</p></a>';
  });
  return h+'</div>'+footer();
}

function viewMissing(){
  var names=Object.keys(DEAD).sort(function(a,b){return DEAD[b].length-DEAD[a].length||a.localeCompare(b,'es')});
  var h='<div class="crumb"><a href="#inicio">Archivo</a> › Fichas pendientes</div>'
   +'<h1 class="ptitle">Fichas pendientes</h1>'
   +'<p style="max-width:62ch;color:var(--ink2);margin:0 0 26px">Nombres que el archivo ya menciona pero que todavía no tienen página propia. Cada uno es una invitación: si alguno te llama, es tuyo para escribirlo.</p>'
   +'<div class="want">';
  names.forEach(function(n){
    var g=LORE.linkTypes&&LORE.linkTypes[n],t=g?typeOf(g):null;
    h+='<div class="want-row"><span class="meta" style="color:'+(t?t.color:'var(--ink3)')+'">'+esc(t?t.label:'¿?')+'</span>'
     +'<span class="wn">'+esc(n)+'</span>'
     +'<span class="src">mencionado en '+DEAD[n].map(function(p){return '<a href="#'+p.slug+'">'+esc(p.title)+'</a>'}).join(', ')+'</span></div>';
  });
  return h+'</div>'+footer();
}

function renderTree(tree){
  var h='<div class="rail-box"><span class="eyebrow">'+esc(tree.title)+'</span><div class="tree">';
  tree.gens.forEach(function(gen,i){
    if(i>0)h+='<div class="tr-link"></div>';
    var boxes=gen.map(function(nd){
      var p=BY_TITLE[(nd.name||'').toLowerCase()];
      var nm=p?'<a href="#'+p.slug+'" style="color:'+colorOf(p.type)+'">'+esc(nd.name)+'</a>':esc(nd.name);
      return '<div class="tr-node'+(nd.dead?' dead':'')+'"><div class="nm">'+nm+(nd.dead?' †':'')+'</div>'+(nd.epithet?'<div class="ep">'+esc(nd.epithet)+'</div>':'')+'</div>';
    }).join('');
    h+=gen.length>1?'<div class="tr-gen">'+boxes+'</div>':boxes;
  });
  return h+'</div></div>';
}

function viewPage(p){
  var r=renderBody(p.content),t=typeOf(p.type),c=colorOf(p.type);
  var h='<div class="crumb"><a href="#inicio">Archivo</a> › <a href="#indice">'+esc(t?t.label:'')+'</a> › '+esc(p.title)+'</div>';
  h+='<article class="page"><div><span class="typepill" style="--c:'+c+'">'+esc(t?t.label:'')+'</span>'
   +'<h1 class="ptitle">'+esc(p.title)+'</h1><div class="body">'+r.html+'</div>'+footer()+'</div><aside class="rail">';
  if(r.secs.length>1){
    h+='<div class="rail-box toc"><span class="eyebrow">En esta página</span><ol>';
    r.secs.forEach(function(s){h+='<li><a href="#'+p.slug+'|'+s.id+'">'+esc(s.label)+'</a></li>'});
    h+='</ol></div>';
  }
  if(p.tree)h+=renderTree(p.tree);
  var back=IN[p.slug]||[];
  if(back.length){
    h+='<div class="rail-box"><span class="eyebrow">Mencionado en</span><div class="tagrow">';
    back.forEach(function(b){h+='<a href="#'+b.slug+'">'+esc(b.title)+'</a>'});
    h+='</div></div>';
  }
  var out=(OUT[p.slug]||[]).filter(function(n){return BY_TITLE[n.toLowerCase()]});
  if(out.length){
    h+='<div class="rail-box"><span class="eyebrow">Menciona a</span><div class="tagrow">';
    out.forEach(function(n){var d=BY_TITLE[n.toLowerCase()];h+='<a href="#'+d.slug+'">'+esc(d.title)+'</a>'});
    h+='</div></div>';
  }
  return h+'</aside></article>';
}

function viewLost(id){
  return '<div class="crumb"><a href="#inicio">Archivo</a></div><h1 class="ptitle">Esa página no está en el archivo</h1>'
   +'<p class="empty" style="padding-top:0">No existe <code style="font-family:var(--mono);font-size:15px">#'+esc(id)+'</code>. Puede que aún no se publique. <a href="#faltantes">Ver fichas pendientes</a> o <a href="#indice">ir al índice</a>.</p>'+footer();
}
function footer(){
  return '<div class="foot"><span>Avelir · lore v'+esc(LORE.version||'—')+' · actualizado '+esc(LORE.exportedAt||'—')+'</span><span>Solo lectura · el canon se edita en el Hub</span></div>';
}

/* ── notas: UI ── */
function refreshNotesUI(){
  var d=nload(),k=noteKey();
  document.getElementById('notes-title').textContent='Notas — '+noteLabel(k);
  document.getElementById('notes-sub').textContent=HAS_LS?'Solo tuyas — se guardan en este navegador':'Este navegador no permite guardar: las notas viven solo mientras la pestaña esté abierta';
  document.getElementById('notes-ta').value=(d[k]&&d[k].text)||'';
  document.getElementById('notes-save').textContent='';
  var ks=Object.keys(d).filter(function(x){return d[x]&&d[x].text});
  var cnt=document.getElementById('notecount');
  cnt.hidden=!ks.length;cnt.textContent=ks.length;
  var h='';
  if(ks.length){
    h+='<span class="eyebrow">Todas tus notas</span>';
    ks.sort(function(a,b){return (d[b].updated||0)-(d[a].updated||0)});
    ks.forEach(function(x){
      h+='<div class="nitem"><button class="del" data-del="'+esc(x)+'">borrar</button>'
       +'<a href="'+(x==='_generales'?'#inicio':'#'+x)+'">'+esc(noteLabel(x))+'</a>'
       +'<p>'+esc(clip(d[x].text,140))+'</p></div>';
    });
  }
  document.getElementById('notes-all').innerHTML=h;
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click',function(){
      var d2=nload();delete d2[this.getAttribute('data-del')];nsave(d2);refreshNotesUI();renderSidebar();
    });
  });
}
document.getElementById('notes-ta').addEventListener('input',function(){
  var d=nload(),k=noteKey();
  if(this.value.trim())d[k]={text:this.value,updated:Date.now()};else delete d[k];
  nsave(d);
  document.getElementById('notes-save').textContent=HAS_LS?'Guardado':'';
  var ks=Object.keys(d).length,cnt=document.getElementById('notecount');
  cnt.hidden=!ks;cnt.textContent=ks;
});
document.getElementById('notes-ta').addEventListener('blur',function(){refreshNotesUI();renderSidebar()});
document.getElementById('notesbtn').addEventListener('click',function(){document.body.classList.toggle('notes-open');if(document.body.classList.contains('notes-open'))refreshNotesUI()});
document.getElementById('notes-close').addEventListener('click',function(){document.body.classList.remove('notes-open')});
document.getElementById('notes-export').addEventListener('click',function(){
  var d=nload(),lines=['# Mis notas de Avelir','',''];
  Object.keys(d).forEach(function(k){if(!d[k]||!d[k].text)return;lines.push('## '+noteLabel(k),'',d[k].text,'')});
  var blob=new Blob([lines.join('\n')],{type:'text/markdown'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='avelir-notas.md';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},500);
});

/* ── enrutador ── */
function curRoute(){var raw=(location.hash||'#inicio').slice(1);return raw.split('|')[0]||'inicio'}
function route(){
  var raw=(location.hash||'#inicio').slice(1),anchor='';
  if(raw.indexOf('|')>-1){var s=raw.split('|');raw=s[0];anchor=s[1]}
  if(!raw)raw='inicio';
  var app=document.getElementById('app');
  if(raw==='inicio')app.innerHTML=viewHome();
  else if(raw==='indice')app.innerHTML=viewIndex();
  else if(raw==='faltantes')app.innerHTML=viewMissing();
  else if(BY_SLUG[raw])app.innerHTML=viewPage(BY_SLUG[raw]);
  else app.innerHTML=viewLost(raw);
  renderSidebar();
  if(document.body.classList.contains('notes-open'))refreshNotesUI();
  document.body.classList.remove('sb-open');
  document.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click',function(){
      var t=this.getAttribute('data-t'),i=F.indexOf(t);
      if(i>-1)F.splice(i,1);else F.push(t);
      route();
    });
  });
  if(anchor){var el=document.getElementById(anchor);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  else window.scrollTo(0,0);
}

/* ── buscador global ── */
var qi=document.getElementById('q');
qi.addEventListener('input',function(){
  Q=this.value;
  if(curRoute()!=='indice')location.hash='#indice';
  else route();
  qi.focus();
});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement!==qi&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();qi.focus()}
  if(e.key==='Escape'){document.body.classList.remove('notes-open','sb-open')}
});
document.getElementById('burger').addEventListener('click',function(){document.body.classList.toggle('sb-open')});
document.getElementById('overlay').addEventListener('click',function(){document.body.classList.remove('sb-open')});

window.addEventListener('hashchange',route);
route();
</script>
