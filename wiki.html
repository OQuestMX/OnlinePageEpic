<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avelir — Archivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F2EC; --card:#FFFFFF; --ink:#191C1F; --ink2:#5B6168; --ink3:#8B9099;
  --line:#DEE1DC; --line2:#C9CDC6; --note:#F3E9C8; --notedge:#D9C98F;
  --serif:"Newsreader",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  --sbw:250px; --ntw:320px; --topbar:57px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbar) + 12px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.65}
a{color:inherit}
button{font-family:var(--sans);cursor:pointer}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}


/* ═══════════════════════════════════════════════════════════════════
   EL PERSONAJE — puente de estilo hacia el motor de maestrías.
   El motor pide 23 variables que este archivo no tenía. Se mapean a la
   paleta del Archivo, con esquinas cuadradas para que no se sienta
   pegado de otra app.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --surface:var(--card); --surface2:#FBFAF7; --border:var(--line); --ink4:#A8ADB4;
  --gold:#B9A55C; --gold-ink:#7E6C28; --gold-pale:#FAF6E9; --gold-light:#F1E9CE;
  --green:#3D6B4A; --green-light:#E9F0EA;
  --blue:#3A5E86;  --blue-light:#E9EEF4;
  --purple:#5F4A7A;--purple-light:#EFEBF4;
  --red:#8E4040;   --red-light:#F4EAEA;
  --font:var(--sans); --r:2px; --r-lg:3px;
}

/* cabecera del héroe */
.pc-head{border:1px solid var(--line);background:var(--card);padding:22px 24px;margin-bottom:1px}
.pc-name{font-size:clamp(28px,4vw,40px);font-weight:300;letter-spacing:-.02em;line-height:1.05;margin:0 0 6px}
.pc-sub{font-family:var(--sans);font-size:13.5px;color:var(--ink2)}
.pc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-top:0;margin-bottom:30px;font-family:var(--sans)}
.pc-stat{background:var(--card);padding:13px 15px}
.pc-stat b{display:block;font-size:25px;font-weight:500;font-family:var(--serif);line-height:1.15}
.pc-stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.pc-stat small{display:block;font-size:11px;color:var(--ink3);margin-top:2px;text-transform:none;letter-spacing:0}

/* estado vacío */
.pc-empty{border:1px solid var(--line);background:var(--card);padding:34px 30px;max-width:60ch}
.pc-empty h2{font-weight:300;font-size:28px;margin:0 0 10px;letter-spacing:-.01em}
.pc-empty p{color:var(--ink2);margin:0 0 18px;font-size:17px}
.pc-btn{display:inline-block;font-family:var(--sans);font-size:14px;text-decoration:none;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:2px}
.pc-btn:hover{background:#000}
.pc-btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.pc-btn.ghost:hover{border-color:var(--ink3);background:#F8F7F3}
.pc-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pc-msg{font-family:var(--sans);font-size:13.5px;margin-top:12px}

/* lo que sigue */
.nx{border:1px solid var(--line);background:var(--card);margin-bottom:1px;padding:15px 18px;font-family:var(--sans)}
.nx-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}
.nx-row{display:flex;gap:11px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.nx-row:last-child{border-bottom:0}
.nx-row b{font-weight:500;color:var(--ink)}
.nx-row .br{font-size:11.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.nx-cost{font-family:var(--mono);font-size:11.5px;color:var(--gold-ink);background:var(--gold-pale);
  border:1px solid var(--gold-light);border-radius:2px;padding:1px 7px;white-space:nowrap}
.nx-none{font-size:14px;color:var(--ink2);font-style:italic}

/* habilidades */
.ab{border:1px solid var(--line);background:var(--card);padding:16px 19px;margin-bottom:1px}
.ab-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.ab-n{font-size:19px;font-weight:400}
.ab-tag{font-family:var(--sans);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:100px;padding:2px 9px;color:var(--ink3)}
.ab-cost{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:auto}
.ab-d{font-size:15.5px;color:var(--ink2);line-height:1.6}
.ab-tb{width:100%;border-collapse:collapse;margin-top:10px;font-family:var(--sans);font-size:13px}
.ab-tb td{padding:4px 9px;border-top:1px solid var(--line)}
.ab-tb td.bd{width:62px;text-align:center;font-weight:500;color:var(--ink2);background:#FAFAF8}
.ab-tb tr.hi td{background:var(--gold-pale)}
.ab-tb tr.hi td.bd{color:var(--gold-ink)}
.ab-note{font-size:12px;color:var(--ink3);font-style:italic;margin-top:6px}

/* reglas y compendio */
.rg{border:1px solid var(--line);background:var(--card);padding:17px 20px;margin-bottom:1px}
.rg h3{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 10px}
.rg p{margin:0 0 10px;font-size:15.5px;color:var(--ink2)}
.rg p:last-child{margin-bottom:0}
.rg-tb{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13.5px}
.rg-tb th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  font-weight:500;padding:5px 9px;border-bottom:1px solid var(--line2)}
.rg-tb td{padding:5px 9px;border-bottom:1px solid var(--line);color:var(--ink2)}
.rg-tb td.k{color:var(--ink);font-weight:500;width:34%}
.rg-tb tr.hi td{background:var(--gold-pale);color:var(--ink)}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line)}
.cmp-c{background:var(--card);padding:15px 17px}
.cmp-c h4{margin:0 0 3px;font-size:18px;font-weight:400}
.cmp-c .r{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.cmp-c p{margin:6px 0 0;font-size:14px;color:var(--ink2);line-height:1.55}
.cmp-c.mine{background:var(--gold-pale)}
.cmp-c.mine h4{color:var(--gold-ink)}

/* el árbol dentro del Archivo */
.mst-wrap{margin-top:6px}
.pc-tabs{display:flex;gap:0;border:1px solid var(--line);border-bottom:0;font-family:var(--sans);flex-wrap:wrap}
.pc-tab{flex:1;min-width:110px;background:var(--card);border:0;border-right:1px solid var(--line);
  padding:11px 8px;font-size:13px;color:var(--ink2)}
.pc-tab:last-child{border-right:0}
.pc-tab.on{background:var(--ink);color:var(--paper)}
.pc-tab:not(.on):hover{background:#F8F7F3;color:var(--ink)}
@media(max-width:760px){
  .pc-stats{grid-template-columns:repeat(2,1fr)}
  .nx-row{flex-wrap:wrap}
  .nx-row .br{margin-left:0}
}

/* ── el botón de nota, anclado a cualquier cosa ── */
.nbtn{background:none;border:1px solid var(--line2);border-radius:2px;width:24px;height:24px;
  font-size:12px;line-height:1;color:var(--ink3);padding:0;flex:none;font-family:var(--sans)}
.nbtn:hover{border-color:var(--ink3);color:var(--ink);background:#F8F7F3}
.nbtn.on{border-color:var(--notedge);background:var(--note);color:#6B5A18}
.nbtn-slot{margin-left:auto;display:inline-flex}
.ab-h .nbtn{margin-left:8px}
.mst-node-head .nbtn-slot{margin-left:auto}
.pc-head{position:relative}
.pc-head .nbtn{position:absolute;top:18px;right:18px;width:30px;height:30px;font-size:14px}
@media print{
  .top,.sb,#notes,.nbtn,.pc-btn,.pc-tabs{display:none!important}
  .main{margin:0!important;padding:0!important;max-width:none!important}
  .ab,.rg,.nx{break-inside:avoid;page-break-inside:avoid}
}

/* ── la hoja imprimible dentro del Archivo ── */
.sheet-wrap{background:#fff;border:1px solid var(--line)}
.sheet-wrap,.sheet-wrap *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  .no-print{display:none!important}
  .sheet-wrap{border:0}
  body{background:#fff}
}

/* ── los campos escribibles de la hoja ── */
.sheet-edit{white-space:pre-wrap;word-wrap:break-word;border-radius:2px;padding:0 2px;transition:background-color .12s}
.sheet-edit:focus{background-color:#FFFDF4;box-shadow:0 0 0 2px #E8DCB0}
.sheet-edit:empty:before{content:attr(data-ph);color:#B9B4A8;font-style:italic}
@media print{ .sheet-edit:focus{background:none;box-shadow:none} .sheet-edit:empty:before{content:''} }

/* ── el simulador del compendio ── */
.cmp-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px;align-items:start}
.sim{position:sticky;top:calc(var(--topbar) + 20px);font-family:var(--sans);
  border:1px solid var(--line2);background:var(--card);padding:16px 17px}
.sim-l{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:11px 0 3px}
.sim-l:first-of-type{margin-top:0}
.sim-s{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line2);border-radius:2px;padding:6px 8px;cursor:pointer}
.sim-s:focus{outline:none;border-color:#B9A55C}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:14px 0 12px}
.sim-c{background:var(--card);padding:9px 10px}
.sim-c span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.sim-c b{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.2}
.sim-d{font-family:var(--sans);font-size:11px;font-weight:500;margin-left:5px;vertical-align:2px}
.sim-d.up{color:var(--green)} .sim-d.dn{color:var(--red)}
.sim-b{font-size:12.5px;color:var(--ink2);line-height:1.5;padding:9px 0;border-top:1px solid var(--line)}
.sim-k{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.sim-f{font-size:11.5px;color:var(--ink3);font-style:italic;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.sim-r{background:none;border:0;padding:0;font-size:11.5px;color:var(--ink2);text-decoration:underline;
  text-underline-offset:2px;font-style:normal;font-family:var(--sans)}
.sim-r:hover{color:var(--ink)}
@media(max-width:1000px){
  .cmp-layout{grid-template-columns:1fr;gap:0}
  .sim{position:static;margin-bottom:26px;order:-1}
}
@media print{ .sim{display:none} .cmp-layout{grid-template-columns:1fr} }

/* ── explicación de las marcas ── */
.mk{border:1px solid var(--line);background:var(--card);margin:-30px 0 30px;font-family:var(--sans)}
.mk-s{cursor:pointer;padding:12px 18px;font-size:13.5px;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px}
.mk-s::-webkit-details-marker{display:none}
.mk-s:before{content:'?';flex:none;width:18px;height:18px;border-radius:10px;border:1px solid var(--notedge);
  background:var(--note);color:#6B5A18;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.mk-s:hover{color:var(--ink)}
.mk[open] .mk-s{border-bottom:1px solid var(--line)}
.mk-b{padding:4px 18px 6px}
.mk-r{font-size:13.5px;color:var(--ink2);line-height:1.6;padding:11px 0;border-bottom:1px solid var(--line)}
.mk-k{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.mk-u{margin:5px 0 0;padding-left:17px}
.mk-u li{margin-bottom:4px}

/* ══════ MAESTRÍAS — compartido entre index.html y creador-personaje.html ══════ */
.mst{margin-top:26px}
.mst-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mst-tabs{display:flex;gap:6px;flex-wrap:wrap}
.mst-tab{padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:var(--surface);
  font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--ink3);cursor:pointer;white-space:nowrap}
.mst-tab .n{font-size:10px;color:var(--ink4);font-weight:600;margin-left:5px}
.mst-tab.active{background:var(--gold-pale);border-color:var(--gold);color:var(--gold)}
.mst-tab.owned{border-color:var(--gold)}
.mst-marks{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--gold-pale);
  border:1px solid var(--gold);border-radius:20px;margin-left:auto}
.mst-marks-l{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.6px}
.mst-marks-v{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink)}
.mst-mbtn{border:1px solid var(--gold);background:var(--surface);color:var(--gold);border-radius:50%;
  width:24px;height:24px;font-size:13px;line-height:1;cursor:pointer;padding:0}

.mst-root{display:flex;gap:14px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-lg);
  border:1px solid var(--border);background:var(--surface2);margin-bottom:16px}
.mst-root.on{border-color:var(--gold);background:var(--gold-pale)}
.mst-root.can{cursor:pointer;border-style:dashed}
.mst-root-body{flex:1;min-width:0}
.mst-root-name{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink)}
.mst-root-eff{font-size:12.5px;color:var(--ink3);line-height:1.55;margin-top:3px}

.mst-cols{display:grid;gap:14px}
.mst-col{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;
  display:flex;flex-direction:column}
.mst-col.locked{opacity:.42}
.mst-col-head{padding:11px 13px;background:var(--surface2);border-bottom:1px solid var(--border)}
.mst-col-name{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);line-height:1.15}
.mst-col-sub{font-size:11px;color:var(--ink4);font-style:italic}
.mst-col-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.mst-chip{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:9px;
  background:var(--surface);border:1px solid var(--border);color:var(--ink3)}
.mst-chip.gold{background:var(--gold-pale);border-color:var(--gold);color:var(--gold)}
.mst-low{font-size:11px;color:var(--ink3);line-height:1.45;padding:8px 13px;border-bottom:1px solid var(--border);
  background:var(--gold-pale)}
.mst-low b{color:var(--gold);font-size:10px;letter-spacing:.5px;display:block;margin-bottom:2px}

.mst-tier{padding:9px 13px;border-bottom:1px solid var(--border)}
.mst-tier:last-child{border-bottom:0}
.mst-tier-head{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
.mst-tier-t{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink4)}
.mst-gate{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--border);color:var(--ink4);white-space:nowrap}
.mst-gate.open{border-color:var(--gold);color:var(--gold);background:var(--gold-pale)}

.mst-node{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;
  background:var(--surface2);cursor:not-allowed;position:relative}
.mst-node:last-child{margin-bottom:0}
.mst-node.can{cursor:pointer;background:var(--surface);border-style:dashed}
.mst-node.can:hover{border-color:var(--gold);background:var(--gold-pale)}
.mst-node.own{background:var(--gold-pale);border-color:var(--gold);cursor:pointer}
.mst-node.lock{opacity:.45}
.mst-node-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mst-node-name{font-size:13px;font-weight:700;color:var(--ink);flex:1;min-width:90px}
.mst-node-eff{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:3px}
.mst-node-fire{font-size:11px;color:var(--ink2);line-height:1.45;margin-top:5px;padding:5px 7px;
  border-radius:6px;background:var(--surface);border-left:2px solid var(--gold)}
.mst-node-fire b{color:var(--gold);font-size:9.5px;letter-spacing:.5px}
.mst-tick{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);flex:none;
  display:flex;align-items:center;font-size:9px;justify-content:center;color:#fff}
.mst-node.own .mst-tick,.mst-root.on .mst-tick{background:var(--gold);border-color:var(--gold)}

.pl{font-size:8.5px;font-weight:700;letter-spacing:.5px;padding:1px 6px;border-radius:8px;flex:none}
.pl-avelir{background:var(--green-light);color:var(--green)}
.pl-veil{background:var(--blue-light);color:var(--blue)}
.pl-hold{background:var(--purple-light);color:var(--purple)}
.pl-inter{background:var(--red-light);color:var(--red)}
.mst-tag{font-size:8.5px;font-weight:700;letter-spacing:.5px;padding:1px 6px;border-radius:8px;
  background:var(--ink);color:#fff;flex:none}

.mst-sum{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  padding:12px 14px;border:1px solid var(--gold);border-radius:var(--r-lg);background:var(--gold-pale);margin-bottom:16px}
.mst-sum-k{font-size:9.5px;font-weight:700;letter-spacing:.7px;color:var(--gold)}
.mst-sum-v{font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.35;margin-top:2px}
.mst-sum-v small{font-family:var(--font);font-size:11.5px;color:var(--ink3);display:block}
@media(max-width:900px){.mst-cols{grid-template-columns:1fr!important}}

/* ── tabla de ataque base ── */
.mst-base{border:1.5px solid var(--gold);border-radius:var(--r-lg);background:var(--gold-pale);padding:14px 16px;margin-bottom:14px}
.mst-base-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.mst-base-t{font-size:11px;letter-spacing:1.4px;font-weight:700;color:var(--gold-ink)}
.mst-base-n{font-size:11.5px;color:var(--ink3);font-style:italic}
.mst-base-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.mst-base-tb th{font-size:10px;letter-spacing:.6px;color:var(--ink3);font-weight:700;text-align:center;padding:3px 6px;border-bottom:1px solid var(--gold)}
.mst-base-tb th small{display:block;font-size:9.5px;letter-spacing:0;font-weight:400;color:var(--ink4);text-transform:none}
.mst-base-tb td{padding:4px 6px;border-bottom:1px solid var(--border);text-align:center}
.mst-base-tb td.bd{font-weight:700;color:var(--ink2);width:74px}
.mst-base-tb td.dm{font-family:var(--serif);font-size:16px;color:var(--ink);width:52px}
.mst-base-tb td.pc{color:var(--ink2);font-variant-numeric:tabular-nums}
.mst-base-tb tr.hi td{background:var(--gold-light)}
.mst-base-tb tr.hi td.bd,.mst-base-tb tr.hi td.dm{color:var(--gold-ink);font-weight:700}
.mst-base-tb tr.sig td{text-align:left;font-size:11.5px;color:var(--ink2);background:transparent;border-bottom:none;padding-top:5px}
.mst-base-mods{margin-top:9px;padding-top:8px;border-top:1px dashed var(--gold);font-size:11.5px;color:var(--ink2);line-height:1.65}
.mst-base-mods b{color:var(--gold-ink);font-weight:700}
.mst-base-mods small{color:var(--ink3)}

/* ═══ barra superior ═══ */
.top{position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:40;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px}
.burger{display:none;background:none;border:1px solid var(--line2);border-radius:2px;width:34px;height:34px;font-size:16px;color:var(--ink2)}
.brand{font-size:20px;text-decoration:none;white-space:nowrap}
.brand em{font-style:italic;color:var(--ink2)}
.topsearch{flex:1;max-width:460px;display:flex;align-items:center;gap:9px;border:1px solid var(--line2);background:var(--card);border-radius:2px;padding:7px 12px;margin:0 auto}
.topsearch svg{flex:none;stroke:var(--ink3)}
.topsearch input{border:0;outline:0;background:transparent;font-family:var(--sans);font-size:14px;color:var(--ink);width:100%}
.topsearch input::placeholder{color:var(--ink3)}
.topsearch:focus-within{border-color:#B9A55C}
.topsearch kbd{font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.notesbtn{background:none;border:1px solid var(--line2);border-radius:2px;padding:7px 13px;font-size:13px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:7px}
.notesbtn:hover{color:var(--ink);border-color:var(--ink3)}
.notesbtn .dot{min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}

/* ═══ sidebar izquierdo ═══ */
.sb{position:fixed;top:var(--topbar);left:0;bottom:0;width:var(--sbw);z-index:30;background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:18px 0 30px;font-family:var(--sans)}
.sb-sec{margin-bottom:4px}
.sb-static{display:block;padding:7px 18px;font-size:13.5px;color:var(--ink2);text-decoration:none;border-left:2px solid transparent}
.sb-static:hover{color:var(--ink)}
.sb-static.on{color:var(--ink);border-left-color:var(--ink);background:#ECEEE9}
.sb-h{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:7px 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:left;margin-top:14px}
.sb-h .tw{font-size:9px;transition:transform .15s;color:var(--ink3)}
.sb-h .cd{width:7px;height:7px;border-radius:4px;flex:none}
.sb-h.open .tw{transform:rotate(90deg)}
.sb-h .n{margin-left:auto;font-size:11px}
.sb-h:hover{color:var(--ink2)}
.sb-list{display:none}
.sb-h.open + .sb-list{display:block}
.sb-a{display:flex;align-items:center;gap:7px;padding:5px 18px 5px 28px;font-size:13.5px;color:var(--ink2);text-decoration:none;border-left:2px solid transparent;line-height:1.35}
.sb-a:hover{color:var(--ink)}
.sb-a.on{color:var(--ink);border-left-color:currentColor;background:#ECEEE9}
.sb-a .nd{width:5px;height:5px;border-radius:3px;background:var(--notedge);flex:none;margin-left:auto}
@media(prefers-reduced-motion:reduce){.sb-h .tw{transition:none}}

/* ═══ contenido ═══ */
.main{margin-left:var(--sbw);padding:calc(var(--topbar) + 26px) 40px 80px;max-width:1060px;transition:margin-right .2s}
body.notes-open .main{margin-right:var(--ntw)}
.crumb{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin-bottom:10px}
.crumb a{color:var(--ink3);text-decoration:none}
.crumb a:hover{color:var(--ink)}

/* portada */
.hero h1{font-weight:300;font-size:clamp(36px,5.5vw,56px);line-height:1.03;margin:6px 0 12px;letter-spacing:-.02em}
.hero p{margin:0 0 30px;max-width:58ch;color:var(--ink2);font-size:19px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:38px;font-family:var(--sans)}
.stat{background:var(--card);padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:500}
.stat span{font-size:12px;color:var(--ink3)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.cell{background:var(--card);padding:19px 21px;text-decoration:none;display:block}
.cell:hover{background:#FBFBFA;background:color-mix(in srgb,var(--c,#888) 6%,#fff)}
.cell .rule{width:26px;height:2px;margin-bottom:11px}
.cell h3{font-weight:400;font-size:20px;margin:0 0 7px;letter-spacing:-.01em}
.cell p{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink2)}

/* índice */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 24px}
.chip{font-size:12.5px;padding:4px 12px;border:1px solid var(--line2);border-radius:100px;background:transparent;color:var(--ink2)}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.res{border-top:1px solid var(--line)}
.res a{display:block;padding:17px 0;border-bottom:1px solid var(--line);text-decoration:none}
.res a:hover .rt{text-decoration:underline;text-underline-offset:3px}
.res .meta{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.res .rt{font-size:20px;display:block;margin-bottom:4px}
.res .snip{font-size:15.5px;color:var(--ink2);line-height:1.6;margin:0}
.res mark{background:var(--note);color:var(--ink);padding:0 2px}
.empty{padding:38px 0;color:var(--ink2);font-size:17px}

/* artículo */
.page{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:48px;align-items:start}
.ptitle{font-weight:300;font-size:clamp(32px,5vw,46px);line-height:1.05;margin:10px 0 24px;letter-spacing:-.02em}
.body{max-width:66ch}
.body h2{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:36px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
.body h2:first-child{margin-top:0;border-top:0;padding-top:0}
.body p{margin:0 0 15px}
.body ul{margin:0 0 15px;padding-left:20px}
.body li{margin-bottom:6px}
.body strong{font-weight:500}
.body em{font-style:italic;color:var(--ink2)}
.wl{text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:1px}
.wl:hover{background:#EDEFEA}
.wl-dead{color:var(--ink3);border-bottom:1px dotted var(--ink3);cursor:help}
.typepill{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:100px;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,#fff)}

/* rail derecho del artículo */
.rail{position:sticky;top:calc(var(--topbar) + 20px);font-family:var(--sans)}
.rail-box{margin-bottom:26px}
.rail .eyebrow{display:block;margin-bottom:10px}
.toc ol{list-style:none;margin:0;padding:0;counter-reset:s}
.toc li{counter-increment:s}
.toc a{display:flex;gap:9px;font-size:13px;color:var(--ink2);text-decoration:none;padding:4px 0;line-height:1.4}
.toc a:before{content:counter(s,decimal-leading-zero);color:var(--ink3);font-size:11px;padding-top:2px}
.toc a:hover{color:var(--ink)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow a{font-size:12.5px;text-decoration:none;padding:4px 11px;border:1px solid var(--line2);border-radius:100px;color:var(--ink2)}
.tagrow a:hover{border-color:var(--ink3);color:var(--ink)}

/* linaje */
.tree{border:1px solid var(--line2);background:var(--card);padding:14px 14px 10px}
.tr-node{border:1px solid var(--line);padding:8px 10px;margin-bottom:0}
.tr-node .nm{font-size:13.5px;font-weight:500;line-height:1.3}
.tr-node .nm a{text-decoration:none;border-bottom:1px solid var(--line2)}
.tr-node .nm a:hover{border-bottom-color:var(--ink)}
.tr-node .ep{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.35}
.tr-node.dead .nm{color:var(--ink3)}
.tr-link{width:1px;height:14px;background:var(--line2);margin:0 auto}
.tr-gen{border-left:2px solid var(--line2);padding-left:10px;display:flex;flex-direction:column;gap:8px}

/* faltantes */
.want{border-top:1px solid var(--line)}
.want-row{display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.want-row .meta{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;min-width:86px}
.want-row .wn{font-size:19px}
.want-row .src{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin-left:auto}
.want-row .src a{color:var(--ink3)}

/* ═══ panel de notas ═══ */
.notes{position:fixed;top:var(--topbar);right:0;bottom:0;width:var(--ntw);z-index:35;background:#FBF8EE;border-left:1px solid var(--notedge);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;font-family:var(--sans)}
body.notes-open .notes{transform:none}
@media(prefers-reduced-motion:reduce){.notes{transition:none}}
.notes-h{padding:16px 18px 10px;border-bottom:1px solid var(--notedge)}
.notes-h .t{font-family:var(--serif);font-size:17px}
.notes-h .s{font-size:12px;color:var(--ink3);margin-top:2px}
.notes-ta{flex:none;margin:14px 18px 6px;border:1px solid var(--notedge);background:var(--card);font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--ink);padding:10px 12px;min-height:150px;resize:vertical;outline:none;border-radius:2px}
.notes-ta:focus{border-color:#B9A55C}
.notes-save{margin:0 18px 12px;font-size:11.5px;color:var(--ink3);min-height:15px}
.notes-all{flex:1;overflow-y:auto;padding:6px 18px 20px;border-top:1px solid var(--notedge)}
.notes-all .eyebrow{display:block;margin:12px 0 8px}
.nitem{border:1px solid var(--notedge);background:var(--card);padding:9px 11px;margin-bottom:8px;border-radius:2px}
.nitem a{font-size:13px;font-weight:500;text-decoration:none}
.nitem a:hover{text-decoration:underline}
.nitem p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.5;white-space:pre-line}
.nitem .del{background:none;border:0;color:var(--ink3);font-size:11px;padding:0;float:right}
.nitem .del:hover{color:#8b1a1a}
.notes-foot{padding:10px 18px;border-top:1px solid var(--notedge);display:flex;gap:8px}
.notes-foot button{flex:1;background:var(--card);border:1px solid var(--notedge);border-radius:2px;padding:7px;font-size:12.5px;color:var(--ink2)}
.notes-foot button:hover{color:var(--ink)}

.foot{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin-top:60px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap}
.overlay{display:none;position:fixed;inset:0;z-index:25;background:rgba(20,22,20,.35)}
body.sb-open .overlay{display:block}

@media(max-width:980px){
  .page{grid-template-columns:1fr;gap:26px}
  .rail{position:static}
}
@media(max-width:820px){
  .burger{display:block}
  .sb{transform:translateX(-100%);transition:transform .2s;z-index:45}
  body.sb-open .sb{transform:none}
  .main{margin-left:0;padding:calc(var(--topbar) + 20px) 20px 60px}
  body.notes-open .main{margin-right:0}
  .notes{width:min(92vw,360px);z-index:46}
  .topsearch kbd{display:none}
  body{font-size:17px}
}
</style>

<body>

<header class="top">
  <button class="burger" id="burger" aria-label="Abrir navegación">☰</button>
  <a class="brand" href="#inicio">Avelir <em>— archivo</em></a>
  <div class="topsearch">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Buscar en el archivo" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <button class="notesbtn" id="notesbtn">✎ Notas <span class="dot" id="notecount" hidden>0</span></button>
</header>

<div class="overlay" id="overlay"></div>
<nav class="sb" id="sb" aria-label="Navegación del archivo"></nav>

<main class="main" id="app"></main>

<aside class="notes" id="notes" aria-label="Tus notas">
  <div class="notes-h">
    <div class="t" id="notes-title">Notas</div>
    <div class="s" id="notes-sub">Solo tuyas — se guardan en este navegador</div>
  </div>
  <textarea class="notes-ta" id="notes-ta" placeholder="Apunta aquí lo que esta página te dispare — una idea, una duda, el germen de un despacho…"></textarea>
  <div class="notes-save" id="notes-save"></div>
  <div class="notes-all" id="notes-all"></div>
  <div class="notes-foot">
    <button id="notes-export">Exportar todas (.md)</button>
    <button id="notes-close">Cerrar</button>
  </div>
</aside>

<script src="data.js"></script>
<script src="lore.js"></script>
<script>
if(typeof LORE==='undefined'){
  document.getElementById('app').innerHTML='<section style="padding:60px 0 40px;max-width:60ch">'
   +'<h1 style="font-weight:300;font-size:clamp(30px,5vw,44px);letter-spacing:-.02em;margin:0 0 14px">El archivo est\u00e1 vac\u00edo</h1>'
   +'<p style="color:var(--ink2);font-size:18px;line-height:1.65">Esta p\u00e1gina se nutre de <code style="font-family:var(--mono);font-size:15px">lore.js</code>, y no lo encontr\u00f3 en su misma carpeta. Coloca el archivo <code style="font-family:var(--mono);font-size:15px">lore.js</code> junto a <code style="font-family:var(--mono);font-size:15px">wiki.html</code> y recarga. El lore se genera desde el Hub: Configuraci\u00f3n \u2192 \ud83c\udf10 lore.js p\u00fablico.</p></section>';
  document.querySelector('.top').style.display='flex';
  throw new Error('LORE no cargado');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function typeOf(id){for(var i=0;i<LORE.types.length;i++)if(LORE.types[i].id===id)return LORE.types[i];return null}
function colorOf(id){var t=typeOf(id);return t&&t.color?t.color:'#5B6168'}

/* ── grafo ── */
var BY_SLUG={},BY_TITLE={},OUT={},IN={},DEAD={};
(function(){
  LORE.pages.forEach(function(p){p.slug=slug(p.title);BY_SLUG[p.slug]=p;BY_TITLE[p.title.trim().toLowerCase()]=p});
  LORE.pages.forEach(function(p){
    OUT[p.slug]=[];var rx=/\[\[([^\]]+)\]\]/g,m,seen={};
    while((m=rx.exec(p.content||''))!==null){
      var name=m[1].trim(),key=name.toLowerCase();
      if(seen[key])continue;seen[key]=1;
      OUT[p.slug].push(name);
      var t=BY_TITLE[key];
      if(t)(IN[t.slug]=IN[t.slug]||[]).push(p);
      else (DEAD[name]=DEAD[name]||[]).push(p);
    }
  });
})();

/* ── notas (localStorage con guardia) ── */
var NK='avelir_notas_v1',HAS_LS=true,MEM={};
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){HAS_LS=false}
function nload(){if(!HAS_LS)return MEM;try{return JSON.parse(localStorage.getItem(NK)||'{}')}catch(e){return{}}}
function nsave(d){MEM=d;if(HAS_LS)try{localStorage.setItem(NK,JSON.stringify(d))}catch(e){}}
function noteKey(){ if(NOTE_TARGET) return NOTE_TARGET; var r=curRoute(); return BY_SLUG[r]?r:'_generales' }
function noteLabel(k){
  var a = (typeof noteAnchorLabel==='function') ? noteAnchorLabel(k) : null;
  if(a) return a;
  return k==='_generales'?'Generales':(BY_SLUG[k]?BY_SLUG[k].title:k);
}

/* ── markdown + enlaces ── */
function inline(t){
  t=esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  return t.replace(/\[\[([^\]]+)\]\]/g,function(_,name){
    name=name.trim();
    var p=BY_TITLE[name.toLowerCase()];
    if(p)return '<a class="wl" style="color:'+colorOf(p.type)+'" href="#'+p.slug+'">'+esc(name)+'</a>';
    var g=LORE.linkTypes&&LORE.linkTypes[name],lb=g&&typeOf(g)?typeOf(g).label:'sin ficha';
    return '<span class="wl-dead" title="'+esc(lb)+' — todavía sin página">'+esc(name)+'</span>';
  });
}
function renderBody(md){
  var lines=String(md||'').split('\n'),out='',ul=false,secs=[];
  function cu(){if(ul){out+='</ul>';ul=false}}
  lines.forEach(function(ln){
    var t=ln.trim();if(!t){cu();return}
    var h=t.match(/^#+\s*(.+)$/);
    if(h){cu();var id=slug(h[1]);secs.push({id:id,label:h[1]});out+='<h2 id="'+id+'">'+inline(h[1])+'</h2>';return}
    if(/^[-*]\s+/.test(t)){if(!ul){out+='<ul>';ul=true}out+='<li>'+inline(t.replace(/^[-*]\s+/,''))+'</li>';return}
    cu();out+='<p>'+inline(t)+'</p>';
  });
  cu();return{html:out,secs:secs};
}
function lastSection(md){
  var parts=String(md||'').split(/^#+\s*.+$/m),tail=parts[parts.length-1]||'';
  return tail.replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/\*\*?/g,'').trim();
}
function clip(s,n){s=s.replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n).replace(/\s+\S*$/,'')+'…':s}
function plain(md){return String(md||'').replace(/^#+\s*.+$/gm,' ').replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/\*\*?/g,'').replace(/\s+/g,' ').trim()}

/* ── sidebar ── */
var SB_OPEN={};
LORE.types.forEach(function(t){SB_OPEN[t.id]=true});
function renderSidebar(){
  var r=curRoute(),notes=nload(),h='';
  h+='<div class="sb-sec">';
  h+='<div class="sb-h" style="margin-top:0;pointer-events:none">Tu personaje</div>';
  h+='<a class="sb-static'+(r==='personaje'?' on':'')+'" href="#personaje">'+(hasHero()?esc(HERO.name):'Mi héroe')+'</a>';
  h+='<a class="sb-static'+(r==='habilidades'?' on':'')+'" href="#habilidades">Mis habilidades</a>';
  h+='<a class="sb-static'+(r==='hoja'?' on':'')+'" href="#hoja">Mi hoja imprimible</a>';
  var _nn=Object.keys(nload()).filter(function(x){return nload()[x]&&nload()[x].text}).length;
  h+='<a class="sb-static'+(r==='notas'?' on':'')+'" href="#notas">Mis notas'+(_nn?' · '+_nn:'')+'</a>';
  h+='<a class="sb-static'+(r==='reglas'?' on':'')+'" href="#reglas">Reglas</a>';
  h+='<a class="sb-static'+(r==='compendio'?' on':'')+'" href="#compendio">Compendio</a>';
  h+='<div class="sb-h" style="pointer-events:none">El Archivo</div>';
  h+='<a class="sb-static'+(r==='inicio'?' on':'')+'" href="#inicio">Estado del mundo</a>';
  h+='<a class="sb-static'+(r==='indice'?' on':'')+'" href="#indice">Índice y búsqueda</a>';
  var nd=Object.keys(DEAD).length;
  h+='<a class="sb-static'+(r==='faltantes'?' on':'')+'" href="#faltantes">Fichas pendientes · '+nd+'</a>';
  h+='</div>';
  LORE.types.forEach(function(t){
    var pages=LORE.pages.filter(function(p){return p.type===t.id});
    if(!pages.length)return;
    pages.sort(function(a,b){return a.title.localeCompare(b.title,'es')});
    h+='<button class="sb-h'+(SB_OPEN[t.id]?' open':'')+'" data-sb="'+t.id+'"><span class="tw">▶</span><span class="cd" style="background:'+colorOf(t.id)+'"></span>'+esc(t.label)+'<span class="n">'+pages.length+'</span></button>';
    h+='<div class="sb-list">';
    pages.forEach(function(p){
      h+='<a class="sb-a'+(p.slug===r?' on':'')+'" style="'+(p.slug===r?'color:'+colorOf(p.type):'')+'" href="#'+p.slug+'">'+esc(p.title)+(notes[p.slug]?'<span class="nd" title="Tienes una nota aquí"></span>':'')+'</a>';
    });
    h+='</div>';
  });
  document.getElementById('sb').innerHTML=h;
  document.querySelectorAll('.sb-h').forEach(function(b){
    b.addEventListener('click',function(){var id=this.getAttribute('data-sb');SB_OPEN[id]=!SB_OPEN[id];renderSidebar()});
  });
}

/* ── vistas ── */
function homeHeroCard(){
  if(!G()) return '';
  if(!hasHero()) return '<a class="cell" href="#personaje" style="--c:#B9A55C;border:1px solid var(--line);margin-bottom:38px;display:block">' +

    '<p>Tu ficha, tu árbol de maestrías y todo lo que puedes llegar a hacer, aquí mismo.</p></a>';

/* ═══════════════════════════════════════════════════════════════════════
   NOTAS ANCLADAS
   El Archivo ya guardaba una nota por página de lore. Aquí esa misma
   libreta aprende a pegarse a cosas más chicas: un nodo del árbol, una
   habilidad, un arma, tu propio personaje. Misma clave de almacenamiento,
   mismo panel, misma exportación — solo cambia a qué se ancla.
   ═══════════════════════════════════════════════════════════════════════ */
var NOTE_TARGET = null;   /* si está puesto, manda sobre la ruta actual */

/* de dónde vino la nota → a dónde regresa */
function noteRoute(k){
  if(k === 'pj' || k.indexOf('nodo:') === 0) return '#personaje';
  if(k.indexOf('hab:') === 0) return '#habilidades';
  if(k.indexOf('kit:') === 0 || k.indexOf('clase:') === 0 || k.indexOf('arma:') === 0) return '#compendio';
  if(k === '_generales') return '#inicio';
  return '#' + k;
}
/* cómo se llama esa nota en la lista */
function noteAnchorLabel(k){
  var g = (typeof GAMEDATA !== 'undefined') ? GAMEDATA : null;
  if(k === 'pj') return (typeof HERO !== 'undefined' && HERO && HERO.name) ? HERO.name : 'Mi personaje';
  if(k.indexOf('nodo:') === 0){
    var id = k.slice(5), hit = null;
    if(g) g.masteryTrunks.forEach(function(t){
      if(t.root.id === id) hit = t.root.name + ' · ' + t.name;
      t.branches.forEach(function(b){ b.tiers.forEach(function(ti){ ti.nodes.forEach(function(n){
        if(n.id === id) hit = n.name + ' · ' + b.name }) }) });
    });
    return hit || id;
  }
  if(k.indexOf('hab:')   === 0) return k.slice(4);
  if(k.indexOf('arma:')  === 0){ var w = g && g.weapons.find(function(x){return x.id===k.slice(5)}); return w?w.name:k.slice(5) }
  if(k.indexOf('kit:')   === 0){ var kk = g && g.kits.find(function(x){return x.id===k.slice(4)}); return kk?kk.name:k.slice(4) }
  if(k.indexOf('clase:') === 0){ var c = g && g.classes.find(function(x){return x.id===k.slice(6)}); return c?c.name:k.slice(6) }
  return null;
}
/* el grupo al que pertenece, para la vista Mis notas */
function noteGroup(k){
  if(k === 'pj') return 'Mi personaje';
  if(k.indexOf('nodo:') === 0) return 'Nodos del árbol';
  if(k.indexOf('hab:')  === 0) return 'Habilidades';
  if(k.indexOf('arma:') === 0 || k.indexOf('kit:') === 0 || k.indexOf('clase:') === 0) return 'Compendio';
  if(k === '_generales') return 'Generales';
  return 'El Archivo';
}

/* abre el panel apuntando a una cosa concreta */
function noteOn(key){
  NOTE_TARGET = key;
  document.body.classList.add('notes-open');

/* ¿esta ancla ya tiene nota escrita? */
function hasNote(key){
  var d = nload();
  return !!(d[key] && d[key].text && d[key].text.trim());
}

function noteBtn(key, titulo){
  var on = hasNote(key);
  return '<button class="nbtn' + (on ? ' on' : '') + '" onclick="noteOn(&quot;' + esc(key) + '&quot;)" ' +
         'title="' + esc(on ? 'Tienes una nota aquí' : (titulo || 'Escribir una nota aquí')) + '">✎</button>';
}

/* los nodos del árbol los pinta el motor compartido; el botón se cuelga
   después, en el DOM, para no tocar el motor que index.html también usa */
function anclarNotasEnNodos(){
  var cont = document.querySelector('.mst-wrap');
  if(!cont) return;
  cont.querySelectorAll('.mst-node').forEach(function(el){
    if(el.querySelector('.nbtn')) return;
    var nombre = el.querySelector('.mst-node-name');
    if(!nombre) return;
    var id = el.getAttribute('data-node');
    if(!id){                                     /* los bloqueados no traen data-node */
      var txt = nombre.textContent.trim(), g = (typeof GAMEDATA!=='undefined') ? GAMEDATA : null;
      if(g) g.masteryTrunks.forEach(function(t){ t.branches.forEach(function(b){
        b.tiers.forEach(function(ti){ ti.nodes.forEach(function(n){ if(n.name === txt) id = n.id }) }) }) });
    }
    if(!id) return;
    var head = el.querySelector('.mst-node-head');
    if(!head) return;
    var b = document.createElement('span');
    b.innerHTML = noteBtn('nodo:' + id, 'Nota sobre ' + nombre.textContent.trim());
    b.className = 'nbtn-slot';
    /* el nodo entero es cliqueable para comprar: que el botón no dispare eso */
    b.addEventListener('click', function(ev){ ev.stopPropagation() });
    head.appendChild(b);
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   EL SIMULADOR
   «¿Y si hubiera sido Monje?» — arma un héroe hipotético con lo que
   elijas y te dice cómo quedaría. No toca tu personaje real: es un
   banco de pruebas para leer el compendio con algo en las manos.
   ═══════════════════════════════════════════════════════════════════════ */
var SIM = null;   /* {classId, kitId, trunkId} */

function simInit(){
  if(SIM) return SIM;
  var g = G();
  SIM = {
    classId: (HERO && HERO.classId) || (g ? g.classes[0].id : null),
    kitId:   (HERO && HERO.kitId)   || (g ? g.kits[0].id   : null),
    trunkId: (HERO && HERO.trunkId) || (g ? g.masteryTrunks[0].id : null)
  };
  return SIM;
}
function simSet(campo, valor){
  simInit(); SIM[campo] = valor;
  var el = document.getElementById('sim-panel');
  if(el) el.innerHTML = simPanelInner();     /* solo el panel, sin repintar todo */
}
function simReset(){
  SIM = null; simInit();
  var el = document.getElementById('sim-panel');
  if(el) el.innerHTML = simPanelInner();
}

function simPanelInner(){
  var g = G(); if(!g) return '';
  var s = simInit();
  var c  = g.classes.find(function(x){ return x.id === s.classId }) || null;
  var k  = g.kits.find(function(x){ return x.id === s.kitId })       || null;
  var tk = g.masteryTrunks.find(function(x){ return x.id === s.trunkId }) || null;

  var hp     = (g.rules.hpBase||10) + (k ? (k.hpBonus||0) : 0);
  var echo   = (c ? ((c.echoBase)||(c.type==='Magic'?2:1)) : 1) + ((k&&k.aenBonus)?k.aenBonus:0);
  var cargas = echo<=2?2:(echo<=4?3:4);

  /* contra el héroe real, cuando existe */
  var dif = null;
  if(hasHero()){
    var rc = gClass(), rk = gKit();
    var rhp   = (g.rules.hpBase||10) + (rk ? (rk.hpBonus||0) : 0);
    var recho = (rc ? ((rc.echoBase)||(rc.type==='Magic'?2:1)) : 1) + ((rk&&rk.aenBonus)?rk.aenBonus:0);
    dif = { hp: hp - rhp, echo: echo - recho };
  }
  function delta(n){
    if(dif === null || !n) return '';
    return '<span class="sim-d ' + (n>0?'up':'dn') + '">' + (n>0?'+':'') + n + '</span>';
  }
  function sel(campo, lista, actual, etiqueta){
    var h = '<label class="sim-l">' + etiqueta + '</label><select class="sim-s" ' +
            'onchange="simSet(&quot;' + campo + '&quot;, this.value)">';
    lista.forEach(function(o){
      h += '<option value="' + esc(o.id) + '"' + (o.id===actual?' selected':'') + '>' + esc(o.name) +
           (o.extra ? ' — ' + esc(o.extra) : '') + '</option>';
    });
    return h + '</select>';
  }

/* ═══════════════════════════════════════════════════════════════════════
   TU PERSONAJE DENTRO DEL ARCHIVO
   Lee el héroe que creaste en creador-personaje.html. Los dos archivos
   viven en el mismo sitio, así que comparten el mismo almacén del
   navegador: lo que creas allá aparece aquí solo.
   ═══════════════════════════════════════════════════════════════════════ */
var HERO_KEY = 'eq_hero_v1';
var HERO = null;
var PC_MSG = '';

function heroLoad(){
  try{ var s = localStorage.getItem(HERO_KEY); return s ? JSON.parse(s) : null }catch(e){ return null }
}
function heroSave(){
  try{ localStorage.setItem(HERO_KEY, JSON.stringify(HERO)) }catch(e){}
}
function hasHero(){ return !!(HERO && HERO.name) }
function G(){ return (typeof GAMEDATA !== 'undefined') ? GAMEDATA : null }
function gClass(){ var g=G(); if(!g||!HERO)return null; return g.classes.find(function(c){return c.id===HERO.classId})||null }
function gSub(){ var g=G(); if(!g||!HERO||!HERO.subclassId)return null; var f=null;
  g.classes.forEach(function(c){ (c.subclasses||[]).forEach(function(s){ if(s.id===HERO.subclassId) f=s }) }); return f }
function gKit(){ var g=G(); if(!g||!HERO)return null; return g.kits.find(function(k){return k.id===HERO.kitId})||null }
function gFaction(){ var g=G(); if(!g||!HERO)return null; return g.factions.find(function(f){return f.id===HERO.factionId})||null }
function gTrunk(id){ var g=G(); if(!g)return null; return g.masteryTrunks.find(function(t){return t.id===id})||null }

/* el puente que el motor de maestrías espera */
var MSTH = {
  data:     function(){ return G() },
  esc:      function(s){ return esc(s) },
  get:      function(){ return HERO ? {marks:HERO.marks||[], marksTotal:(HERO.marksTotal==null?1:HERO.marksTotal)} : {marks:[],marksTotal:0} },
  set:      function(pid, obj){
              if(!HERO) return;
              if(obj.marks !== undefined) HERO.marks = obj.marks;
              if(obj.marksTotal !== undefined) HERO.marksTotal = obj.marksTotal;
              heroSave();
            },
  rerender: function(){ route() }
};

/* ── importar / traer de otro dispositivo ── */
function heroFromText(txt){
  var o;
  try{ o = JSON.parse(txt) }catch(e){ return {error:'Eso no parece un archivo .json.'} }
  if(!o || typeof o !== 'object' || Array.isArray(o)) return {error:'El archivo no tiene forma de héroe.'};
  if(!o.name) return {error:'Al archivo le falta el nombre del héroe.'};
  var g = G();
  if(g){
    var faltan = [];
    if(o.classId && !g.classes.some(function(c){return c.id===o.classId})) faltan.push('la clase «'+o.classId+'»');
    if(o.kitId   && !g.kits.some(function(k){return k.id===o.kitId}))      faltan.push('el kit «'+o.kitId+'»');
    if(o.trunkId && !g.masteryTrunks.some(function(t){return t.id===o.trunkId})) faltan.push('el tronco «'+o.trunkId+'»');
    if(faltan.length) return {error:'Tu héroe usa '+faltan.join(' y ')+', que no existe en esta versión.'};
  }
  return {hero:o};
}
function heroImportText(txt){
  var r = heroFromText(txt);
  if(r.error){ PC_MSG = '<span style="color:var(--red)">✗ '+esc(r.error)+'</span>'; route(); return false }
  HERO = r.hero; heroSave(); PC_MSG=''; location.hash = '#personaje'; route(); return true;
}
function heroImportFile(input){
  var f = input.files && input.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(ev){ heroImportText(String(ev.target.result)) };
  rd.readAsText(f); input.value = '';
}
function heroDownload(){
  if(!HERO) return;
  var b = new Blob([JSON.stringify(HERO,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  var base = (HERO.name||'heroe').normalize('NFD').split('').filter(function(ch){
    var c = ch.charCodeAt(0); return c < 768 || c > 879;   /* fuera los diacríticos combinantes */
  }).join('').replace(/[^a-zA-Z0-9_-]+/g,'_');
  a.download = base + '.json';
  a.click();
}
function pcPickFile(){ var i=document.getElementById('pc-file'); if(i)i.click() }
function pcPasteImport(){ var t=document.getElementById('pc-paste'); if(t)heroImportText(t.value) }

/* ── qué es una marca ──
   Cuidado aquí: data.js define qué COMPRA una marca, pero no de dónde
   sale. Cuántas da una sesión sigue sin decidirse, así que el texto no
   lo inventa: dice que las reparte el Story Master, y punto. */
function marcasExplica(d){
  var g = G(), libres = d.total - d.spent;
  var h = '<details class="mk"><summary class="mk-s">' +
          (libres > 0
            ? 'Tienes <b>' + libres + '</b> marca' + (libres===1?'':'s') + ' sin gastar · ¿qué hago con ' + (libres===1?'ella':'ellas') + '?'
            : 'No te quedan marcas libres · ¿cómo consigo más?') +
          '</summary><div class="mk-b">';

  h += '<div class="mk-r"><span class="mk-k">Qué es</span>' +
       'Una marca es un punto de avance con tu arma. <b>Una marca compra un nodo</b> del árbol — uno solo, y para siempre. ' +
       'No se gastan en combate ni se recuperan al descansar: son permanentes.</div>';

  h += '<div class="mk-r"><span class="mk-k">De dónde salen</span>' +
       'Naciste con <b>una</b>, gastada en la Raíz de tu arma. Las demás <b>te las da tu Story Master</b> conforme avanza la historia. ' +
       'No hay una cuota fija por sesión: él decide cuándo y cuántas. Cuando te dé una, súbela con el <b>+</b> del árbol.</div>';

  h += '<div class="mk-r"><span class="mk-k">Qué compran</span>';
  var b = [];
  b.push('la <b>Raíz</b> de un tronco te sube el ataque base de 1d12 a <b>2d12 quedándote con el mejor</b>');
  b.push('el primer nodo de cualquier rama te regala su <b>firma de banda 1–4</b> gratis — algo que hacer cuando sacas mala tirada');
  b.push('una <b>Maestría</b> te lleva a <b>3d12</b> con esa arma, y enciende tu dado de firma en el 12');
  h += '<ul class="mk-u"><li>' + b.join('</li><li>') + '</li></ul></div>';

  if(g && g.masteryRules){
    h += '<div class="mk-r"><span class="mk-k">Cómo se abre el árbol</span>' +
         esc(g.masteryRules.marks) + '</div>';
  }
  h += '<div class="mk-r" style="border-bottom:0">' +
       'Si sueltas un nodo, la marca vuelve — y si algo dependía de él, también se suelta. Nada se pierde: puedes reacomodar.' +
       '</div>';
  return h + '</div></details>';
}

/* ── bloque: lo que sigue ── */
function lqSigue(d, tr){
  var libres = d.total - d.spent;
  var h = '<div class="nx"><div class="nx-t">Lo que sigue</div>';

  /* qué puede comprar ahora mismo */
  var listos = [];
  var miTronco = tr ? tr.id : null;
  mstTrunks().forEach(function(t){
    var mio = (t.id === miTronco);
    if(!d.own[t.root.id]){ listos.push({n:t.root.name, br:t.name+' · Raíz', mio:mio, otro:!mio}); return }
    t.branches.forEach(function(b){
      b.tiers.forEach(function(ti, ix){
        if(!d.branches[b.id].tiers[ix].unlocked) return;
        ti.nodes.forEach(function(n){ if(!d.own[n.id]) listos.push({n:n.name, br:t.name+' · '+b.name, mio:mio, otro:!mio}) });
      });
    });
  });
  /* lo de tu propio tronco primero: abrir otro tronco es una decisión distinta */
  listos.sort(function(a,b){ return (a.mio===b.mio) ? 0 : (a.mio ? -1 : 1) });
  if(libres > 0 && listos.length){
    h += '<div style="font-size:13.5px;color:var(--ink2);margin-bottom:7px">Con '+libres+
         (libres===1?' marca libre puedes tomar':' marcas libres puedes tomar')+':</div>';
    var mostrados = listos.slice(0,8), yaOtro = false;
    mostrados.forEach(function(x){
      if(x.otro && !yaOtro){ yaOtro = true;
        h += '<div class="nx-row" style="border-bottom:0;padding-bottom:2px"><span style="font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)">O empezar otro tronco</span></div>';
      }
      h += '<div class="nx-row"><b>'+esc(x.n)+'</b><span class="br">'+esc(x.br)+'</span></div>';
    });
    if(listos.length>8) h += '<div class="nx-row" style="color:var(--ink3)">y '+(listos.length-8)+' más en el árbol</div>';
  } else if(libres > 0){
    h += '<div class="nx-none">Tienes '+libres+' marca(s) libre(s), pero no hay nada abierto todavía.</div>';
  } else {
    h += '<div class="nx-none">No tienes marcas libres. Tu Story Master te dará más al avanzar la historia.</div>';
  }

  /* camino a la próxima Maestría */
  if(tr){
    var caminos = [];
    tr.branches.forEach(function(b){
      var st = d.branches[b.id];
      if(!st || st.mastery) return;
      var faltan = 0, nombre = null;
      b.tiers.forEach(function(ti){
        ti.nodes.forEach(function(n){
          if(!d.own[n.id]) faltan++;
          if(n.mast && !nombre) nombre = n.name;
        });
      });
      if(nombre) caminos.push({b:b.name, n:nombre, faltan:faltan, die:b.die});
    });
    caminos.sort(function(a,b){ return a.faltan - b.faltan });
    if(caminos.length){
      h += '<div class="nx-t" style="margin-top:16px">Camino a tu próxima Maestría</div>';
      caminos.forEach(function(c){
        h += '<div class="nx-row"><b>'+esc(c.n)+'</b>' +
             '<span class="nx-cost">'+c.faltan+' marca'+(c.faltan===1?'':'s')+'</span>' +
             '<span class="br">'+esc(c.b)+' · 3d12 · firma '+esc(c.die)+'</span></div>';
      });
    }
  }
  h += '</div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════
   MOTOR DE MAESTRÍAS — compartido entre index.html y creador-personaje.html
   La página anfitriona define MSTH antes de este bloque:
     MSTH.data()        -> GAMEDATA
     MSTH.get(pid)      -> {marks:[ids], marksTotal:n}
     MSTH.set(pid,obj)  -> guarda {marks} y/o {marksTotal}
     MSTH.rerender()    -> vuelve a pintar
     MSTH.esc(s)        -> escapa html
   ══════════════════════════════════════════════════════════════════════ */
var MST_TRUNK = {};
var MST_PLANE = {avelir:'AVELIR', veil:'VELO', hold:'CUENCO', inter:'INTERPLANO'};

function mstTrunks(){ var g = MSTH.data(); return (g && g.masteryTrunks) ? g.masteryTrunks : [] }
function mstEsc(s){ return MSTH.esc(s) }

/* ── puertas ── */
function gateOk(tier, own){
  var have = 0;
  tier.nodes.forEach(function(n){ if(own[n.id]) have++ });
  if(tier.gate === 'all') return have === tier.nodes.length;
  if(tier.gate === 'any') return have >= 1;
  return have >= Number(tier.gate);
}
function gateLabel(tier){
  if(tier.gate === 'all') return tier.nodes.length === 1 ? '1 de 1' : 'los ' + tier.nodes.length;
  if(tier.gate === 'any') return '1 de ' + tier.nodes.length;
  return tier.gate + ' de ' + tier.nodes.length;
}

/* ── localizar un nodo por id ── */
function mstFind(nodeId){
  var hit = null;
  mstTrunks().forEach(function(tr){
    if(tr.root.id === nodeId){ hit = {tr:tr, root:1}; return }
    tr.branches.forEach(function(br){
      br.tiers.forEach(function(ti, ix){
        ti.nodes.forEach(function(n){ if(n.id === nodeId) hit = {tr:tr, br:br, ti:ti, ix:ix, n:n} });
      });
    });
  });
  return hit;
}


/* ── tabla de ataque base, derivada para este jugador ── */
function mstBandPct(n){
  /* tira n d12 y quédate con el mejor: P(máx ≤ k) = (k/12)^n */
  var le = function(k){ return Math.pow(k/12, n) };
  return { b1: le(4), b2: le(8)-le(4), b3: le(11)-le(8), b12: 1-le(11) };
}
function mstBaseTable(d, tr){
  var g = MSTH.data();
  var BA = g && g.baseAttack;
  if(!BA || !BA.bands) return '';
  var rootOn = !!d.own[tr.root.id];

  /* configuraciones de dado dentro de este tronco */
  var cfgs = [];
  cfgs.push({ n: rootOn ? 2 : 1, lbl: rootOn ? 'Raíz · ' + mstEsc(tr.sub) : 'sin especializar', die: null });
  tr.branches.forEach(function(b){
    if(d.branches[b.id] && d.branches[b.id].mastery)
      cfgs.push({ n:3, lbl:'Maestría · ' + mstEsc(b.name), die:b.die });
  });

  var h = '<div class="mst-base">';
  h += '<div class="mst-base-hd"><span class="mst-base-t">TABLA DE ATAQUE BASE</span>' +
       '<span class="mst-base-n">' + mstEsc(BA.note || '') + '</span></div>';
  h += '<table class="mst-base-tb"><tr><th>Tirada 1d12</th><th>Daño</th>' +
       cfgs.map(function(c){ return '<th>' + c.n + 'd12<small>' + c.lbl + '</small></th>' }).join('') + '</tr>';

  var pcts = cfgs.map(function(c){ return mstBandPct(c.n) });
  BA.bands.forEach(function(b){
    var hi = !!b.signature;
    h += '<tr' + (hi ? ' class="hi"' : '') + '><td class="bd">' + mstEsc(b.dice) + '</td><td class="dm">' + b.dmg + '</td>';
    cfgs.forEach(function(c, i){
      h += '<td class="pc">' + (pcts[i][b.band]*100).toFixed(1) + '%</td>';
    });
    h += '</tr>';
    if(hi){
      var firmas = cfgs.filter(function(c){ return c.die }).map(function(c){ return c.lbl.replace('Maestría · ','') + ' +' + c.die });
      h += '<tr class="sig"><td colspan="' + (2+cfgs.length) + '">✨ En el 12 dispara tu dado de firma: ' +
           (firmas.length ? mstEsc(firmas.join(' · ')) : '<em>ninguno todavía — lo da la Maestría de una rama</em>') + '</td></tr>';
    }
  });
  h += '</table>';

  /* qué de lo comprado mueve la tabla */
  var mods = [];
  tr.branches.forEach(function(b){
    b.tiers.forEach(function(ti){ ti.nodes.forEach(function(n){
      if(!d.own[n.id]) return;
      var t = (n.eff||'') + ' ' + (n.fire||'') + ' ' + (n.active||'');
      if(/\bband\b|\bbands\b|banda/i.test(t)) mods.push(n.name + ' <small>(' + b.name + ')</small>');
    })});
  });
  var lows = d.lows.map(function(l){ return l.low.name + ' <small>(' + l.b + ')</small>' });
  if(mods.length || lows.length){
    h += '<div class="mst-base-mods">';
    if(mods.length) h += '<div><b>Mueven tu banda:</b> ' + mods.join(' · ') + '</div>';
    if(lows.length) h += '<div><b>Rescatan la banda 1-4:</b> ' + lows.join(' · ') + '</div>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* ── estado derivado ── */
function deriveMastery(rec){
  rec = rec || {};
  var own = {};
  (rec.marks || []).forEach(function(id){ own[id] = 1 });
  var out = { own:own, spent:Object.keys(own).length,
              total:(rec.marksTotal == null ? 0 : rec.marksTotal),
              roots:{}, branches:{}, dice:{}, lows:[], reacts:[], legends:[], actives:[] };
  mstTrunks().forEach(function(tr){
    var rootOn = !!own[tr.root.id];
    if(rootOn) out.roots[tr.id] = 1;
    tr.branches.forEach(function(br){
      var st = { open:rootOn, owned:0, tiers:[], mastery:0, die:br.die, low:null };
      var prevOk = rootOn;
      br.tiers.forEach(function(ti){
        var unlocked = prevOk;
        ti.nodes.forEach(function(n){
          if(!own[n.id]) return;
          st.owned++;
          if(n.mast)   st.mastery = 1;
          if(n.react)  out.reacts.push({b:br.name, n:n});
          if(n.legend) out.legends.push({b:br.name, n:n});
          if(n.active) out.actives.push({b:br.name, n:n});
        });
        st.tiers.push({ unlocked:unlocked, done:gateOk(ti, own) });
        prevOk = unlocked && gateOk(ti, own);
      });
      if(st.owned > 0){ st.low = br.low; out.lows.push({b:br.name, low:br.low, die:br.die}) }
      out.branches[br.id] = st;
      if(st.mastery)   out.dice[br.id] = '3d12';
      else if(rootOn)  out.dice[br.id] = '2d12';
    });
  });
  return out;
}

/* ── ¿comprable ahora? ── */
function canBuy(d, tr, br, ix){
  if(!br) return !d.own[tr.root.id];
  if(!d.own[tr.root.id]) return false;
  return d.branches[br.id].tiers[ix].unlocked;
}

/* ── comprar / soltar, con cascada ── */
function masteryToggle(pid, nodeId){
  var rec = MSTH.get(pid);
  if(!rec) return;
  var marks = (rec.marks || []).slice();
  var i = marks.indexOf(nodeId);
  if(i > -1){
    marks.splice(i, 1);
    var guard = 0;
    while(guard++ < 60){
      var d = deriveMastery({marks:marks, marksTotal:rec.marksTotal});
      var drop = null;
      mstTrunks().forEach(function(tr){
        if(!d.own[tr.root.id]){
          tr.branches.forEach(function(br){ br.tiers.forEach(function(ti){
            ti.nodes.forEach(function(n){ if(d.own[n.id] && !drop) drop = n.id }) }) });
        } else {
          tr.branches.forEach(function(br){
            var st = d.branches[br.id];
            br.tiers.forEach(function(ti, ix){
              if(st.tiers[ix].unlocked) return;
              ti.nodes.forEach(function(n){ if(d.own[n.id] && !drop) drop = n.id });
            });
          });
        }
      });
      if(!drop) break;
      marks.splice(marks.indexOf(drop), 1);
    }
  } else {
    var d0 = deriveMastery(rec);
    if(d0.total - d0.spent <= 0) return;
    var f = mstFind(nodeId);
    if(!f) return;
    if(!canBuy(d0, f.tr, f.br, f.ix)) return;
    marks.push(nodeId);
  }
  MSTH.set(pid, {marks:marks});
  MSTH.rerender();
}
function adjustMarks(pid, delta){
  var rec = MSTH.get(pid);
  if(!rec) return;
  var t = Math.max(0, Math.min(60, (rec.marksTotal == null ? 0 : rec.marksTotal) + delta));
  if(delta < 0 && t < (rec.marks || []).length) return;
  MSTH.set(pid, {marksTotal:t});
  MSTH.rerender();
}

/* ── un nodo ── */
function mstNodeHtml(pid, d, tr, br, ix, n, ro){
  var owned = !!d.own[n.id];
  var open  = canBuy(d, tr, br, ix);
  var can   = !owned && open && (d.total - d.spent) > 0;
  var cls   = 'mst-node' + (owned ? ' own' : (open ? ' can' : ' lock'));
  var act   = (!ro && (owned || can))
            ? ' data-action="mastery-toggle" data-id="' + pid + '" data-node="' + n.id + '"' : '';
  var h = '<div class="' + cls + '"' + act + '>';
  h += '<div class="mst-node-head"><span class="mst-tick">' + (owned ? '✓' : '') + '</span>';
  h += '<span class="mst-node-name">' + mstEsc(n.name) + '</span>';
  if(n.react)  h += '<span class="mst-tag">REACCIÓN</span>';
  if(n.mast)   h += '<span class="mst-tag">MAESTRÍA</span>';
  if(n.legend) h += '<span class="mst-tag">LEGENDARIA</span>';
  h += '<span class="pl pl-' + n.plane + '">' + (MST_PLANE[n.plane] || n.plane) + '</span></div>';
  h += '<div class="mst-node-eff">' + mstEsc(n.eff) + '</div>';
  if(n.fire)   h += '<div class="mst-node-fire"><b>AL 12 · ' + mstEsc(n.die || '') + '</b><br>' + mstEsc(n.fire) + '</div>';
  if(n.active) h += '<div class="mst-node-fire"><b>ACTIVA</b><br>' + mstEsc(n.active) + '</div>';
  if(n.bet)    h += '<div class="mst-node-fire"><b>LA APUESTA</b><br>' + mstEsc(n.bet) + '</div>';
  if(n.edge)   h += '<div class="mst-node-fire"><b>BORDE</b><br>No saca de combate a criaturas duras ni a jefes: pierden una acción.</div>';
  return h + '</div>';
}

/* ── el árbol completo ──
   opts: {readonly, showMarks, showTabs, trunkId} */
function masteryTreeHtml(pid, opts){
  opts = opts || {};
  if(!mstTrunks().length) return '';
  var rec = MSTH.get(pid);
  if(!rec) return '';
  var ro  = !!opts.readonly;
  var d   = deriveMastery(rec);
  var tid = opts.trunkId || MST_TRUNK[pid] || mstTrunks()[0].id;
  var tr  = mstTrunks().filter(function(t){ return t.id === tid })[0] || mstTrunks()[0];
  var free = d.total - d.spent;
  var h = '';

  if(opts.showTabs !== false){
    h += '<div class="mst-top"><div class="mst-tabs">';
    mstTrunks().forEach(function(t){
      var cnt = d.own[t.root.id] ? 1 : 0;
      t.branches.forEach(function(b){ cnt += d.branches[b.id].owned });
      h += '<div class="mst-tab' + (t.id === tr.id ? ' active' : '') + (cnt ? ' owned' : '') +
           '" data-action="mastery-trunk" data-id="' + pid + '" data-trunk="' + t.id + '">' +
           mstEsc(t.name) + '<span class="n">' + (cnt || '') + '</span></div>';
    });
    h += '</div>';
    h += '<div class="mst-marks"><span class="mst-marks-l">MARCAS LIBRES</span>' +
         '<span class="mst-marks-v">' + free + '</span>';
    if(opts.showMarks){
      h += '<button class="mst-mbtn" data-action="sub-mark" data-id="' + pid + '">−</button>' +
           '<button class="mst-mbtn" data-action="add-mark" data-id="' + pid + '">+</button>';
    } else {
      h += '<span style="font-size:11px;color:var(--ink3)">de ' + d.total + '</span>';
    }
    h += '</div></div>';
  }

  h += mstBaseTable(d, tr);

  /* resumen de lo que cambió en la mesa */
  if(d.spent){
    var dice = [];
    mstTrunks().forEach(function(t){
      if(!d.own[t.root.id]) return;
      var m = [];
      t.branches.forEach(function(b){ if(d.branches[b.id].mastery) m.push(b.name + ' 3d12 · firma ' + b.die) });
      dice.push(t.name + ' 2d12' + (m.length ? ' → ' + m.join(' • ') : ''));
    });
    var lows = d.lows.map(function(l){ return l.low.name + ' (' + l.b + ')' });
    var nm = function(a){ return a.map(function(x){ return x.n.name }).join(' • ') };
    h += '<div class="mst-sum">' +
      '<div><div class="mst-sum-k">DADOS DE ATAQUE</div><div class="mst-sum-v">' + (dice.length ? mstEsc(dice.join(' • ')) : '1d12') + '</div></div>' +
      '<div><div class="mst-sum-k">FIRMAS DE BANDA 1-4</div><div class="mst-sum-v">' + (lows.length ? mstEsc(lows.join(' • ')) : '—') + '</div></div>' +
      '<div><div class="mst-sum-k">REACCIONES</div><div class="mst-sum-v">' + (d.reacts.length ? mstEsc(nm(d.reacts)) : '—') + '<small>una por ronda, gratis</small></div></div>' +
      '<div><div class="mst-sum-k">INTERPLANO</div><div class="mst-sum-v">' + (d.legends.length ? mstEsc(nm(d.legends)) : '—') + '<small>una por sesión</small></div></div>' +
      '</div>';
  }

  /* raíz */
  var rootOn = !!d.own[tr.root.id];
  var rootCan = !ro && (rootOn || free > 0);
  h += '<div class="mst-root' + (rootOn ? ' on' : (rootCan ? ' can' : '')) + '"' +
       (rootCan ? ' data-action="mastery-toggle" data-id="' + pid + '" data-node="' + tr.root.id + '"' : '') + '>';
  h += '<span class="mst-tick" style="margin-top:3px">' + (rootOn ? '✓' : '') + '</span>';
  h += '<div class="mst-root-body"><div class="mst-root-name">' + mstEsc(tr.root.name) +
       ' <span class="pl pl-' + tr.root.plane + '">' + MST_PLANE[tr.root.plane] + '</span>' +
       ' <span class="mst-tag">RAÍZ</span></div>';
  h += '<div class="mst-root-eff">' + mstEsc(tr.root.eff) + '</div></div>';
  h += '<div style="text-align:right;flex:none"><div class="mst-sum-k">' + mstEsc(tr.sub) + '</div>' +
       '<div class="mst-sum-v">' + tr.root.dice + 'd12</div></div></div>';

  /* ramas */
  h += '<div class="mst-cols" style="grid-template-columns:repeat(' + tr.branches.length + ',1fr)">';
  tr.branches.forEach(function(br){
    var st = d.branches[br.id];
    h += '<div class="mst-col' + (rootOn ? '' : ' locked') + '">';
    h += '<div class="mst-col-head"><div class="mst-col-name">' + mstEsc(br.name) + '</div>' +
         '<div class="mst-col-sub">' + mstEsc(br.sub || '') + '</div>' +
         '<div class="mst-col-chips"><span class="mst-chip' + (st.owned ? ' gold' : '') + '">' + st.owned + ' nodos</span>' +
         '<span class="mst-chip' + (st.mastery ? ' gold' : '') + '">' + (st.mastery ? '3d12' : (rootOn ? '2d12' : '1d12')) + '</span>' +
         '<span class="mst-chip' + (st.owned ? ' gold' : '') + '">firma ' + mstEsc(br.die) + '</span></div></div>';
    if(st.owned && br.low)
      h += '<div class="mst-low"><b>BANDA 1-4 · GRATIS</b>' + mstEsc(br.low.name) + ' — ' + mstEsc(br.low.eff) + '</div>';
    br.tiers.forEach(function(ti, ix){
      var t = st.tiers[ix];
      h += '<div class="mst-tier"><div class="mst-tier-head">' +
           '<span class="mst-tier-t">' + mstEsc(ti.t) + '</span>' +
           '<span class="mst-gate' + (t.done ? ' open' : '') + '">' + gateLabel(ti) + (t.done ? ' ✓' : '') + '</span></div>';
      ti.nodes.forEach(function(n){ h += mstNodeHtml(pid, d, tr, br, ix, n, ro) });
      h += '</div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

/* ── despachador compartido: la página anfitriona lo llama desde su click handler ── */
function mstHandleAction(a, el){
  if(a === 'mastery-trunk'){ MST_TRUNK[el.getAttribute('data-id')] = el.getAttribute('data-trunk'); MSTH.rerender(); return true }
  if(a === 'mastery-toggle'){ masteryToggle(el.getAttribute('data-id'), el.getAttribute('data-node')); return true }
  if(a === 'add-mark'){ adjustMarks(el.getAttribute('data-id'), 1); return true }
  if(a === 'sub-mark'){ adjustMarks(el.getAttribute('data-id'), -1); return true }
  return false;
}


/* el motor pinta nodos con data-action; aquí se despachan */
document.addEventListener('click', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
  if(!el) return;
  var a = el.getAttribute('data-action');
  if(a === 'mastery-toggle' || a === 'add-mark' || a === 'sub-mark' || a === 'mastery-trunk'){
    mstHandleAction(a, el);
  }
});

function route(){
  var raw=(location.hash||'#inicio').slice(1),anchor='';
  if(raw.indexOf('|')>-1){var s=raw.split('|');raw=s[0];anchor=s[1]}
  if(!raw)raw='inicio';
  var app=document.getElementById('app');
  PC_MSG = PC_MSG || '';
  HERO = heroLoad();
  noteClear();
  if(raw==='inicio')app.innerHTML=viewHome();
  else if(raw==='personaje')app.innerHTML=viewChar();
  else if(raw==='habilidades')app.innerHTML=viewAbil();
  else if(raw==='reglas')app.innerHTML=viewRules();
  else if(raw==='compendio')app.innerHTML=viewCompendium();
  else if(raw==='hoja')app.innerHTML=viewSheet();
  else if(raw==='notas')app.innerHTML=viewNotes();
  else if(raw==='indice')app.innerHTML=viewIndex();
  else if(raw==='faltantes')app.innerHTML=viewMissing();
  else if(BY_SLUG[raw])app.innerHTML=viewPage(BY_SLUG[raw]);
  else app.innerHTML=viewLost(raw);
  renderSidebar();
  if(document.body.classList.contains('notes-open'))refreshNotesUI();
  document.body.classList.remove('sb-open');
  document.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click',function(){
      var t=this.getAttribute('data-t'),i=F.indexOf(t);
      if(i>-1)F.splice(i,1);else F.push(t);
      route();
    });
  });
  anclarNotasEnNodos();
  if(typeof sheetBind==='function') sheetBind();
  if(anchor){var el=document.getElementById(anchor);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  else window.scrollTo(0,0);
}

/* ── buscador global ── */
var qi=document.getElementById('q');
qi.addEventListener('input',function(){
  Q=this.value;
  if(curRoute()!=='indice')location.hash='#indice';
  else route();
  qi.focus();
});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement!==qi&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();qi.focus()}
  if(e.key==='Escape'){document.body.classList.remove('notes-open','sb-open')}
});
document.getElementById('burger').addEventListener('click',function(){document.body.classList.toggle('sb-open')});
document.getElementById('overlay').addEventListener('click',function(){document.body.classList.remove('sb-open')});

window.addEventListener('hashchange',route);
route();
</script>
